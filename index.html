<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TSUKI RPG</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#070b12;
  color:white;
  overflow:hidden;
  touch-action:none
}
button{
  border:0;
  cursor:pointer;
  color:white;
  font-weight:bold
}
#app{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#172536,#080d14)
}

/* MENU */
#menu{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 20%,#49647b,#101721 65%)
}
.menu{
  width:min(440px,100%);
  padding:28px;
  text-align:center;
  border-radius:26px;
  background:#0c1521eF;
  border:1px solid #ffffff25;
  box-shadow:0 25px 80px #000b
}
.logo{
  font-size:45px;
  font-weight:1000;
  color:#e5bd5b;
  text-shadow:0 4px 0 #493715
}
.subtitle{
  color:#aebccc;
  margin:8px 0 20px
}
.hero{
  width:190px;
  height:230px;
  display:block;
  margin:auto
}
.btn{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:13px;
  background:#263b53;
  font-size:16px
}
.btn:active{transform:scale(.98)}
.start{
  background:linear-gradient(#e1bd5b,#98691f);
  font-size:19px
}

/* JOGO */
#game{
  position:absolute;
  inset:0;
  display:none;
  background:#27432d
}
#world{
  position:absolute;
  inset:70px 0 0;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 25%,#659453,transparent 22%),
    radial-gradient(circle at 80% 70%,#466d40,transparent 28%),
    linear-gradient(#315438,#1d3225)
}
.grass{
  position:absolute;
  inset:0;
  opacity:.28;
  background-image:radial-gradient(#c0d48a 1px,transparent 1px);
  background-size:25px 25px
}
.path{
  position:absolute;
  width:150%;
  height:120px;
  left:-25%;
  top:45%;
  transform:rotate(-8deg);
  background:#8a7557;
  box-shadow:0 0 20px #0005
}
.tree{
  position:absolute;
  width:70px;
  height:100px
}
.tree:before{
  content:"";
  position:absolute;
  bottom:0;
  left:29px;
  width:15px;
  height:45px;
  border-radius:8px;
  background:#513a25
}
.tree:after{
  content:"";
  position:absolute;
  left:2px;
  top:0;
  width:66px;
  height:66px;
  border-radius:50%;
  background:#24512d;
  box-shadow:25px -12px 0 #316a39,35px 18px 0 #1b4425
}

/* HUD */
#hud{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  background:#08111ddd;
  border-bottom:1px solid #ffffff20
}
.avatar{
  width:50px;
  height:50px;
  border-radius:12px;
  background:#17283a
}
.info{
  display:flex;
  align-items:center;
  gap:9px
}
.name{font-weight:bold}
.lv{font-size:12px;color:#e1bd5b}
.stats{
  text-align:right;
  line-height:20px;
  font-size:13px
}
.gold{color:#ffd55b}

/* PERSONAGEM */
.character{
  position:absolute;
  width:82px;
  height:108px;
  object-fit:contain;
  transform:translate(-50%,-50%);
  z-index:10;
  user-select:none
}
#player{left:50%;top:58%}
#enemy{
  left:72%;
  top:48%;
  display:none;
  z-index:9
}

/* STATUS */
#message{
  position:absolute;
  z-index:30;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 15px;
  border-radius:12px;
  background:#07101bdd;
  color:#e5c564;
  font-size:13px;
  white-space:nowrap
}
.bar{
  position:absolute;
  z-index:30;
  top:110px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  height:9px;
  background:#35151a;
  border-radius:10px;
  overflow:hidden;
  display:none
}
.bar i{
  display:block;
  width:100%;
  height:100%;
  background:#49ce5d
}

/* CONTROLES */
#controls{
  position:absolute;
  inset:0;
  z-index:40;
  pointer-events:none
}
.joy{
  position:absolute;
  pointer-events:auto;
  bottom:18px;
  left:18px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#ffffff18;
  border:3px solid #ffffff35
}
.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:47px;
  height:47px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#ffffff9c;
  border:3px solid white
}
.actions{
  position:absolute;
  right:14px;
  bottom:18px;
  display:flex;
  gap:8px;
  align-items:end;
  pointer-events:auto
}
.action{
  width:63px;
  height:63px;
  border-radius:50%;
  border:3px solid #ffffff35;
  font-size:10px
}
.attack{background:#b54b42}
.magic{background:#6952b5}
.heal{background:#328b58}

/* PAINÉIS */
.panel{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#000b
}
.panel.show{display:flex}
.box{
  width:min(430px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border-radius:22px;
  background:#101c2a;
  border:1px solid #ffffff20
}
.box h2{
  color:#e4c264;
  margin-bottom:14px
}
.item{
  margin:7px 0;
  padding:12px;
  border-radius:10px;
  background:#1b2b3d;
  display:flex;
  justify-content:space-between;
  align-items:center
}
input,select{
  width:100%;
  padding:11px;
  margin:5px 0 10px;
  border-radius:9px;
  border:1px solid #ffffff20;
  background:#07101a;
  color:white
}
.close{background:#683b3b}

/* EFEITOS */
.damage{
  position:absolute;
  z-index:80;
  color:#ffe06a;
  font-size:23px;
  font-weight:1000;
  animation:up .55s forwards;
  pointer-events:none
}
@keyframes up{
  to{transform:translateY(-55px);opacity:0}
}
.flash{animation:flash .18s}
@keyframes flash{
  50%{filter:brightness(2.5)}
}

@media(max-width:600px){
  .logo{font-size:35px}
  .hero{width:160px;height:200px}
  .character{width:72px;height:94px}
}
</style>
</head>

<body>

<div id="app">

<!-- MENU -->
<section id="menu">
  <div class="menu">

    <div class="logo">TSUKI RPG</div>
    <div class="subtitle">Uma nova aventura começa.</div>

    <img id="hero" class="hero">

    <button id="play" class="btn start">
      ✨ COMEÇAR AVENTURA
    </button>

    <button id="inventoryButton" class="btn">
      🎒 INVENTÁRIO
    </button>

    <button id="devButton" class="btn">
      🛠️ DESENVOLVEDOR
    </button>

  </div>
</section>

<!-- JOGO -->
<section id="game">

  <header id="hud">

    <div class="info">
      <img id="avatar" class="avatar">

      <div>
        <div id="name" class="name">Aventureiro</div>
        <div class="lv">
          Nível <span id="level">1</span>
        </div>
      </div>
    </div>

    <div class="stats">
      ❤️ <span id="hp">100</span>/100<br>
      <span class="gold">💰 <span id="gold">100</span></span>
    </div>

  </header>

  <div id="world">
    <div class="grass"></div>
    <div class="path"></div>

    <div class="tree" style="left:5%;top:12%"></div>
    <div class="tree" style="left:78%;top:15%"></div>
    <div class="tree" style="left:12%;top:70%"></div>
    <div class="tree" style="left:84%;top:68%"></div>

    <img id="player" class="character">
    <img id="enemy" class="character">

  </div>

  <div id="message">Explore o mapa</div>

  <div id="enemyBar" class="bar">
    <i id="enemyHp"></i>
  </div>

  <div id="controls">

    <div id="joystick" class="joy">
      <div id="knob" class="knob"></div>
    </div>

    <div class="actions">

      <button id="attack" class="action attack">
        ✨<br>ATACAR
      </button>

      <button id="magic" class="action magic">
        🔮<br>MAGIA
      </button>

      <button id="heal" class="action heal">
        💚<br>CURA
      </button>

    </div>

  </div>

</section>

<!-- INVENTÁRIO -->
<div id="inventoryPanel" class="panel">
  <div class="box">

    <h2>🎒 Inventário</h2>

    <div id="items"></div>

    <button id="closeInventory" class="btn close">
      FECHAR
    </button>

  </div>
</div>

<!-- DESENVOLVEDOR -->
<div id="devPanel" class="panel">
  <div class="box">

    <h2>🛠️ MODO DESENVOLVEDOR</h2>

    <p style="color:#9eacbb;margin-bottom:12px">
      Ferramentas para testar o jogo.
    </p>

    <label>💰 Moedas</label>
    <input id="goldInput" type="number" value="100">

    <button id="addGold" class="btn">
      ADICIONAR MOEDAS
    </button>

    <label>📈 Nível</label>
    <input id="levelInput" type="number" value="1">

    <button id="changeLevel" class="btn">
      ALTERAR NÍVEL
    </button>

    <button id="fullHp" class="btn">
      ❤️ VIDA MÁXIMA
    </button>

    <button id="spawn" class="btn">
      👾 CRIAR CRIATURA
    </button>

    <button id="reset" class="btn">
      🔄 RESETAR JOGO
    </button>

    <button id="closeDev" class="btn close">
      FECHAR
    </button>

  </div>
</div>

</div>

<script>

/* =========================
   PERSONAGEM
========================= */

function characterSVG(enemy=false){

if(enemy){

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="300" height="400">

<ellipse cx="150" cy="375"
rx="90" ry="18" fill="#0005"/>

<path d="M75 180Q150 140 225 180L210 300Q150 330 90 300Z"
fill="#733842" stroke="#151515" stroke-width="8"/>

<circle cx="150" cy="105" r="65"
fill="#9c6b55" stroke="#111" stroke-width="8"/>

<path d="M85 100Q90 20 150 25Q215 20 220 105L185 70L155 96L125 65L105 100Z"
fill="#17171b"/>

<circle cx="125" cy="115" r="10" fill="#ff5353"/>
<circle cx="175" cy="115" r="10" fill="#ff5353"/>

<path d="M120 155Q150 175 180 155"
fill="none" stroke="#32151b" stroke-width="8"/>

</svg>`);
}

return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="300" height="400">

<ellipse cx="150" cy="375"
rx="90" ry="18" fill="#0005"/>

<path d="M90 180Q150 145 210 180L205 290Q150 315 95 290Z"
fill="#315c91" stroke="#111" stroke-width="8"/>

<path d="M105 275L105 360L135 360L145 275"
fill="#202b3b"/>

<path d="M155 275L165 360L195 360L190 275"
fill="#202b3b"/>

<rect x="132" y="135" width="36"
height="45" rx="10" fill="#d7a080"/>

<circle cx="150" cy="105" r="65"
fill="#e2ad89" stroke="#111" stroke-width="7"/>

<path d="M88 105Q82 25 150 25Q220 25 215 110L190 70L170 95L145 62L120 100L100 75Z"
fill="#20242b"/>

<circle cx="125" cy="112" r="8" fill="#17212c"/>
<circle cx="175" cy="112" r="8" fill="#17212c"/>

<path d="M150 115L142 137L155 137"
fill="none" stroke="#9d6d58" stroke-width="5"/>

<path d="M130 150Q150 162 170 150"
fill="none" stroke="#713f3c" stroke-width="5"/>

<path d="M95 190Q50 220 65 270"
fill="none" stroke="#355c87"
stroke-width="28" stroke-linecap="round"/>

</svg>`);
}


/* =========================
   DADOS
========================= */

const player={
  name:"Aventureiro",
  level:1,
  xp:0,
  gold:100,
  hp:100,
  maxHp:100,
  inventory:[
    "Poção pequena",
    "Cristal lunar"
  ]
};

let enemy={
  active:false,
  hp:100,
  maxHp:100
};

let playing=false;
let px=50;
let py=58;


/* =========================
   ELEMENTOS
========================= */

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const playerImg=document.getElementById("player");
const enemyImg=document.getElementById("enemy");
const message=document.getElementById("message");

document.getElementById("hero").src=characterSVG();
document.getElementById("avatar").src=characterSVG();
playerImg.src=characterSVG();
enemyImg.src=characterSVG(true);


/* =========================
   FUNÇÕES PRINCIPAIS
========================= */

function startGame(){

playing=true;

menu.style.display="none";
game.style.display="block";

updateHUD();
updatePlayer();

message.textContent="Explore o mapa";

showMessage("✨ A aventura começou!");

}


function updateHUD(){

document.getElementById("level").textContent=
player.level;

document.getElementById("hp").textContent=
Math.max(0,Math.floor(player.hp));

document.getElementById("gold").textContent=
player.gold;

}


function updatePlayer(){

playerImg.style.left=px+"%";
playerImg.style.top=py+"%";

checkDistance();

}


/* =========================
   MOVIMENTO
========================= */

function move(x,y){

if(!playing)return;

const speed=.22;

px+=x*speed;
py+=y*speed;

px=Math.max(5,Math.min(95,px));
py=Math.max(8,Math.min(90,py));

updatePlayer();

}


function checkDistance(){

if(!enemy.active)return;

const dx=px-enemyX;
const dy=py-enemyY;
const d=Math.hypot(dx,dy);

if(d<16){
message.textContent="👾 Criatura próxima!";
}else{
message.textContent="Explore o mapa";
}

}


/* =========================
   CRIATURA
========================= */

let enemyX=72;
let enemyY=48;

function spawnEnemy(){

enemy.active=true;
enemy.hp=100;

enemyX=72;
enemyY=48;

enemyImg.style.display="block";
enemyImg.style.left=enemyX+"%";
enemyImg.style.top=enemyY+"%";

document.getElementById("enemyBar")
.style.display="block";

updateEnemy();

showMessage("👾 Uma criatura apareceu!");

}


function updateEnemy(){

enemyImg.style.left=enemyX+"%";
enemyImg.style.top=enemyY+"%";

document.getElementById("enemyHp").style.width=
(enemy.hp/enemy.maxHp*100)+"%";

}


setInterval(()=>{

if(!playing||!enemy.active)return;

const dx=px-enemyX;
const dy=py-enemyY;
const d=Math.hypot(dx,dy);

if(d>13){

enemyX+=(dx/d)*.07;
enemyY+=(dy/d)*.07;

updateEnemy();

}

},60);


/* =========================
   ATAQUE
========================= */

function attack(){

if(!playing)return;

if(!enemy.active){

showMessage("Não há criatura aqui.");

return;

}

const dx=px-enemyX;
const dy=py-enemyY;
const d=Math.hypot(dx,dy);

if(d>16){

showMessage("Chegue mais perto!");

return;

}

const damage=25;

enemy.hp-=damage;

damageText(
enemyX,
enemyY,
"-"+damage
);

enemyImg.classList.add("flash");

setTimeout(()=>{
enemyImg.classList.remove("flash");
},180);

updateEnemy();

if(enemy.hp<=0){

defeatEnemy();

}

}


/* =========================
   MAGIA
========================= */

function magic(){

if(!playing)return;

if(!enemy.active){

showMessage("Nenhuma criatura encontrada.");

return;

}

const dx=px-enemyX;
const dy=py-enemyY;
const d=Math.hypot(dx,dy);

if(d>45){

showMessage("A magia não alcançou o alvo.");

return;

}

enemy.hp-=40;

damageText(
enemyX,
enemyY,
"-40 ✨"
);

updateEnemy();

if(enemy.hp<=0){
defeatEnemy();
}

}


/* =========================
   CURA
========================= */

function heal(){

if(!playing)return;

if(player.hp>=player.maxHp){

showMessage("❤️ Sua vida já está cheia.");

return;

}

player.hp+=30;

player.hp=Math.min(
player.hp,
player.maxHp
);

updateHUD();

showMessage("💚 Você recuperou vida!");

}


/* =========================
   DERROTA
========================= */

function defeatEnemy(){

enemy.active=false;

enemyImg.style.display="none";

document.getElementById("enemyBar")
.style.display="none";

player.gold+=25;
player.xp+=50;

checkLevel();
updateHUD();

showMessage("🏆 +50 XP e +25 moedas!");

}


function checkLevel(){

const needed=player.level*100;

if(player.xp>=needed){

player.xp-=needed;
player.level++;
player.maxHp+=20;
player.hp=player.maxHp;

showMessage(
"🎉 Nível "+player.level+"!"
);

}

}


/* =========================
   TEXTO DE DANO
========================= */

function damageText(x,y,text){

const el=document.createElement("div");

el.className="damage";
el.textContent=text;

el.style.left=x+"%";
el.style.top=y+"%";

document.getElementById("world")
.appendChild(el);

setTimeout(()=>{
el.remove();
},600);

}


/* =========================
   INVENTÁRIO
========================= */

function openInventory(){

const box=document.getElementById("items");

box.innerHTML="";

player.inventory.forEach(item=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=
"<span>✨ "+item+"</span>"+
"<span>✓</span>";

box.appendChild(div);

});

document.getElementById("inventoryPanel")
.classList.add("show");

}


function closeInventory(){

document.getElementById("inventoryPanel")
.classList.remove("show");

}


/* =========================
   DESENVOLVEDOR
========================= */

function openDev(){

const password=prompt(
"Senha do modo desenvolvedor:"
);

if(password!=="tsuki123"){

alert("Senha incorreta.");

return;

}

document.getElementById("devPanel")
.classList.add("show");

}


function closeDev(){

document.getElementById("devPanel")
.classList.remove("show");

}


function addGold(){

const value=
Number(document.getElementById("goldInput").value);

if(value>0){

player.gold+=value;
updateHUD();

showMessage("💰 Moedas adicionadas!");

}

}


function changeLevel(){

let value=
Number(document.getElementById("levelInput").value);

value=Math.max(1,value);

player.level=value;
player.maxHp=100+(value-1)*20;
player.hp=player.maxHp;

updateHUD();

showMessage("📈 Nível alterado!");

}


function fullHp(){

player.hp=player.maxHp;

updateHUD();

showMessage("❤️ Vida restaurada!");

}


/* =========================
   RESET
========================= */

function resetGame(){

player.level=1;
player.xp=0;
player.gold=100;
player.hp=100;
player.maxHp=100;

enemy.active=false;

enemyImg.style.display="none";

document.getElementById("enemyBar")
.style.display="none";

px=50;
py=58;

updateHUD();
updatePlayer();

showMessage("🔄 Jogo reiniciado!");

}


/* =========================
   MENSAGEM
========================= */

let messageTimer;

function showMessage(text){

message.textContent=text;

clearTimeout(messageTimer);

messageTimer=setTimeout(()=>{

if(enemy.active){
message.textContent="👾 Criatura no mapa";
}else{
message.textContent="Explore o mapa";
}

},1800);

}


/* =========================
   BOTÕES
========================= */

document.getElementById("play")
.addEventListener("click",startGame);

document.getElementById("inventoryButton")
.addEventListener("click",openInventory);

document.getElementById("devButton")
.addEventListener("click",openDev);

document.getElementById("closeInventory")
.addEventListener("click",closeInventory);

document.getElementById("closeDev")
.addEventListener("click",closeDev);

document.getElementById("attack")
.addEventListener("click",attack);

document.getElementById("magic")
.addEventListener("click",magic);

document.getElementById("heal")
.addEventListener("click",heal);

document.getElementById("addGold")
.addEventListener("click",addGold);

document.getElementById("changeLevel")
.addEventListener("click",changeLevel);

document.getElementById("fullHp")
.addEventListener("click",fullHp);

document.getElementById("spawn")
.addEventListener("click",spawnEnemy);

document.getElementById("reset")
.addEventListener("click",resetGame);


/* =========================
   ANALÓGICO
========================= */

const joystick=document.getElementById("joystick");
const knob=document.getElementById("knob");

let dragging=false;

joystick.addEventListener("pointerdown",e=>{

dragging=true;

joystick.setPointerCapture(e.pointerId);

analog(e);

});


joystick.addEventListener("pointermove",e=>{

if(dragging)analog(e);

});


joystick.addEventListener("pointerup",resetStick);
joystick.addEventListener("pointercancel",resetStick);


function analog(e){

const r=joystick.getBoundingClientRect();

let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;

const max=35;
const d=Math.hypot(x,y);

if(d>max){

x=x/d*max;
y=y/d*max;

}

knob.style.left=
"calc(50% + "+x+"px)";

knob.style.top=
"calc(50% + "+y+"px)";

if(d>7){

move(x/max,y/max);

}

}


function resetStick(){

dragging=false;

knob.style.left="50%";
knob.style.top="50%";

}


/* =========================
   TECLADO
========================= */

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp"||e.key==="w")
move(0,-1);

if(e.key==="ArrowDown"||e.key==="s")
move(0,1);

if(e.key==="ArrowLeft"||e.key==="a")
move(-1,0);
