<script>
let peer = null;
let connection = null;

let myHealth = 100;
let enemyHealth = 100;
let position = 13;

const $ = id => document.getElementById(id);

function showPage(id){
  document.querySelectorAll(".page").forEach(page=>{
    page.classList.remove("active");
  });

  $(id).classList.add("active");
}

function home(){
  showPage("home");
}

function startGame(){

  showPage("battlePage");

  myHealth = 100;
  enemyHealth = 100;

  $("myHealth").style.width = "100%";
  $("enemyHealth").style.width = "100%";

  $("message").textContent = "🔎 Procurando oponente...";

  setTimeout(()=>{
    $("message").textContent = "⚔️ Oponente encontrado!";
  },1200);
}

function attack(){

  if(enemyHealth <= 0) return;

  const damage = Math.floor(Math.random()*9)+10;

  enemyHealth -= damage;

  if(enemyHealth < 0){
    enemyHealth = 0;
  }

  $("enemyHealth").style.width = enemyHealth + "%";

  $("message").textContent =
    "💥 Você causou " + damage + " de dano!";

  send({
    type:"attack",
    damage:damage
  });

  if(enemyHealth <= 0){

    $("message").textContent =
      "🏆 VOCÊ VENCEU!";

    let trophies =
      Number($("trophies").textContent) + 8;

    $("trophies").textContent = trophies;
    $("statTrophies").textContent = trophies;

    $("wins").textContent =
      Number($("wins").textContent) + 1;
  }
}

function superAttack(){

  if(enemyHealth <= 0) return;

  const damage = 25;

  enemyHealth -= damage;

  if(enemyHealth < 0){
    enemyHealth = 0;
  }

  $("enemyHealth").style.width =
    enemyHealth + "%";

  $("message").textContent =
    "⚡ SUPER ATAQUE! -" + damage;

  send({
    type:"attack",
    damage:damage
  });
}

function move(direction){

  position += direction * 7;

  if(position < 2)
    position = 2;

  if(position > 70)
    position = 70;

  $("me").style.left =
    position + "%";

  send({
    type:"move",
    position:position
  });
}

function openRoom(){

  $("roomModal").classList.add("show");
}

function closeRoom(){

  $("roomModal").classList.remove("show");
}

function createRoom(){

  const code =
    Math.random()
    .toString(36)
    .substring(2,7)
    .toUpperCase();

  $("roomCode").value = code;

  peer = new Peer(
    "brawl-tsuki-" + code
  );

  peer.on("open",()=>{

    showPage("battlePage");

    closeRoom();

    $("message").textContent =
      "👥 Sala criada: " + code +
      " — mande o código para seu amigo!";
  });

  peer.on("connection",conn=>{

    connection = conn;

    setupConnection();

    $("message").textContent =
      "🟢 Seu amigo entrou na sala!";
  });

  peer.on("error",error=>{

    console.log(error);

    $("message").textContent =
      "❌ Não foi possível criar a sala.";
  });
}

function joinRoom(){

  const code =
    $("roomCode")
    .value
    .trim()
    .toUpperCase();

  if(!code){

    alert("Digite o código da sala!");

    return;
  }

  peer = new Peer();

  peer.on("open",()=>{

    connection =
      peer.connect(
        "brawl-tsuki-" + code
      );

    setupConnection();

    showPage("battlePage");

    closeRoom();

    $("message").textContent =
      "🔄 Entrando na sala...";
  });

  peer.on("error",error=>{

    console.log(error);

    alert(
      "Não consegui entrar nessa sala."
    );
  });
}

function setupConnection(){

  if(!connection) return;

  connection.on("open",()=>{

    $("message").textContent =
      "🟢 ONLINE! Seu amigo está conectado.";
  });

  connection.on("data",data=>{

    if(data.type === "attack"){

      myHealth -= data.damage;

      if(myHealth < 0)
        myHealth = 0;

      $("myHealth").style.width =
        myHealth + "%";

      if(myHealth <= 0){

        $("message").textContent =
          "💀 VOCÊ PERDEU!";
      }else{

        $("message").textContent =
          "💥 Você recebeu " +
          data.damage +
          " de dano!";
      }
    }

    if(data.type === "move"){

      // Movimento do adversário.
      // Pode ser expandido para sincronizar
      // a posição do segundo jogador.
    }
  });
}

function send(data){

  if(
    connection &&
    connection.open
  ){

    connection.send(data);
  }
}

function editName(){

  const name =
    prompt(
      "Digite seu nome:",
      $("playerName").textContent
    );

  if(name && name.trim()){

    $("playerName").textContent =
      name.trim();

    localStorage.setItem(
      "brawlTsukiName",
      name.trim()
    );
  }
}

const savedName =
  localStorage.getItem(
    "brawlTsukiName"
  );

if(savedName){

  $("playerName").textContent =
    savedName;
}
</script>

</body>
</html>
