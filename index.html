<!-- GERADOR DE BRAWLERS -->
<section class="generator">
  <h2>🎲 GERADOR DE BRAWLER</h2>

  <div id="brawlerCard" class="brawler-card">
    <div id="brawlerIcon">🥊</div>
    <h3 id="brawlerName">Clique para gerar</h3>
    <p id="brawlerRarity">---</p>

    <div class="stats">
      ❤️ <span id="brawlerHp">---</span>
      ⚔️ <span id="brawlerDamage">---</span>
      ⚡ <span id="brawlerSpeed">---</span>
    </div>
  </div>

  <button onclick="generateBrawler()" class="generate">
    🎲 GERAR BRAWLER
  </button>
</section>

<style>
.generator{margin:20px auto;max-width:600px;padding:18px;border-radius:22px;background:linear-gradient(145deg,#173b68,#0b1b31);color:#fff;text-align:center;box-shadow:0 12px 30px #0006}
.generator h2{margin-bottom:14px}
.brawler-card{padding:22px;border-radius:20px;background:linear-gradient(145deg,#28609a,#152b49);transition:.15s}
.brawler-card.pop{transform:scale(1.04)}
#brawlerIcon{font-size:65px}
#brawlerName{font-size:25px;margin:5px}
#brawlerRarity{color:#ffd52f;font-weight:bold}
.stats{display:flex;justify-content:center;gap:15px;margin-top:12px;font-weight:bold}
.generate{width:100%;margin-top:14px;padding:16px;border:0;border-radius:15px;background:linear-gradient(#ffe94e,#ffb817);font-size:18px;font-weight:900;color:#241600;box-shadow:0 5px #a56500}
.generate:active{transform:translateY(4px);box-shadow:0 1px #a56500}
</style>

<script>
const brawlers=[
["Tsuki","🤠","COMUM"],
["T-Bot","🤖","RARO"],
["Ghost","👻","ÉPICO"],
["Ninja","🥷","MÍTICO"],
["Dragon","🐉","LENDÁRIO"],
["Robot","🦾","SUPER RARO"]
];

function generateBrawler(){
  const b=brawlers[Math.floor(Math.random()*brawlers.length)];
  const hp=Math.floor(Math.random()*500)+300;
  const damage=Math.floor(Math.random()*80)+20;
  const speed=(Math.random()*2+3).toFixed(1);

  brawlerIcon.textContent=b[1];
  brawlerName.textContent=b[0];
  brawlerRarity.textContent=b[2];
  brawlerHp.textContent=hp;
  brawlerDamage.textContent=damage;
  brawlerSpeed.textContent=speed;

  brawlerCard.classList.add("pop");
  setTimeout(()=>brawlerCard.classList.remove("pop"),150);
}
</script>
