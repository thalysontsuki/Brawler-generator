<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Países do Mundo - Estudo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 Países do Mundo</h1>
    <p>Aprenda sobre os países enquanto estuda JavaScript</p>
  </header>

  <main>
    <div class="container">
      <!-- Seção de Busca e Filtros -->
      <div class="controls">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="🔍 Buscar país..." 
          class="search-input"
        >
        
        <select id="continentFilter" class="filter-select">
          <option value="">Todos os Continentes</option>
          <option value="Africa">África</option>
          <option value="Americas">Américas</option>
          <option value="Asia">Ásia</option>
          <option value="Europe">Europa</option>
          <option value="Oceania">Oceania</option>
        </select>

        <button id="loadBtn" class="load-btn">📥 Carregar Países</button>
      </div>

      <!-- Status de Carregamento -->
      <div id="status" class="status"></div>

      <!-- Contenedor de Países -->
      <div id="paisesContainer" class="paises-grid">
        <!-- Os países aparecerão aqui -->
      </div>
    </div>
  </main>

  <footer>
    <p>💡 Projeto de estudo com JavaScript, HTML e CSS</p>
    <p>API: <a href="https://restcountries.com" target="_blank">restcountries.com</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
