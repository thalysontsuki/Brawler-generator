<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Brawl Tsuki 2.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#07101d;
  color:#fff;
  overflow:hidden;
  touch-action:none
}
button{
  border:0;
  color:#fff;
  font-weight:900;
  font-size:15px
}
#app{
  width:100%;
  min-height:100vh;
  background:radial-gradient(circle at top,#347eb4,#07101d 75%)
}
header{
  height:65px;
  padding:8px 13px;
  background:#071525ee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:20
}
.logo{
  font-size:23px;
  font-weight:1000;
  text-shadow:0 3px #000
}
.logo span{color:#ffd83d}
.profile{
  display:flex;
  align-items:center;
  gap:8px
}
.avatar{
  width:43px;
  height:43px;
  border-radius:13px;
  background:#214b70;
  display:grid;
  place-items:center;
  font-size:23px;
  border:2px solid #fff
}
.trophies{
  color:#ffd83d;
  font-size:12px
}
.screen{
  display:none;
  width:100%;
  height:calc(100vh - 65px);
  overflow:auto
}
.screen.active{display:block}
.home{
  width:min(900px,100%);
  margin:auto;
  padding:14px
}
.hero{
  min-height:280px;
  padding:25px 18px;
  border-radius:25px;
  background:
    radial-gradient(circle at 80% 20%,#ffd53d55,transparent 30%),
    linear-gradient(145deg,#205f93,#10253e);
  border:2px solid #ffffff18;
  box-shadow:0 15px 35px #0007;
  text-align:center
}
.hero h1{
  font-size:38px;
  text-shadow:0 5px #000;
  margin-top:25px
}
.hero p{
  color:#c8d6e5;
  margin-top:8px
}
.play{
  width:100%;
  max-width:430px;
  padding:17px;
  margin-top:25px;
  border-radius:16px;
  color:#291900;
  background:linear-gradient(#ffe94b,#ffb416);
  box-shadow:0 5px #956000;
  font-size:21px
}
.play:active{
  transform:translateY(4px);
  box-shadow:0 1px #956000
}
.section{
  margin-top:14px;
  padding:15px;
  border-radius:20px;
  background:#102642ee;
  border:2px solid #ffffff10
}
.section h2{margin-bottom:12px}
.brawlerGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}
.brawler{
  padding:6px;
  border-radius:14px;
  background:#183957;
  border:2px solid #ffffff10
}
.brawler img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:10px
}
.brawler b{
  display:block;
  font-size:13px;
  margin-top:5px
}
.brawler small{
  color:#ffd83d
}

/* ARENA */
#game{
  position:relative;
  height:100vh;
  overflow:hidden;
  background:#07101d
}
.arena{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      transparent 49.5%,
      #ffffff66 49.5%,
      #ffffff66 50.5%,
      transparent 50.5%
    ),
    repeating-linear-gradient(
      90deg,
      #38954b 0 80px,
      #419e51 80px 160px
    );
  border:5px solid #fff
}
.arena:before{
  content:"";
  position:absolute;
  width:115px;
  height:115px;
  border:4px solid #ffffff88;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%)
}
.goal{
  position:absolute;
  width:38px;
  height:150px;
  top:50%;
  transform:translateY(-50%);
  border:4px solid #fff
}
.goal.left{left:-5px}
.goal.right{right:-5px}
.score{
  position:absolute;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  padding:8px 25px;
  background:#071525ee;
  border-radius:14px;
  z-index:20;
  font-size:23px;
  font-weight:1000
}
.topInfo{
  position:absolute;
  top:12px;
  left:12px;
  background:#071525dd;
  border-radius:12px;
  padding:7px 10px;
  z-index:20
}
.hp{
  width:130px;
  height:10px;
  background:#35171b;
  border-radius:10px;
  overflow:hidden;
  margin-top:4px
}
.hp i{
  display:block;
  width:100%;
  height:100%;
  background:#44db54
}
.unit{
  position:absolute;
  width:62px;
  height:76px;
  border-radius:16px;
  object-fit:cover;
  z-index:10;
  border:3px solid #fff;
  transition:left .04s,top .04s
}
.enemy{
  border-color:#ff4444;
  z-index:9
}
.ball{
  position:absolute;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#fff;
  border:4px solid #222;
  z-index:11
}
.attackRange{
  position:absolute;
  width:95px;
  height:70px;
  border:4px solid #ffdf3e;
  border-radius:50%;
  opacity:0;
  z-index:8;
  pointer-events:none
}
.attackRange.show{
  opacity:.45
}
.controls{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none
}
.joystick{
  position:absolute;
  left:18px;
  bottom:22px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#ffffff20;
  border:3px solid #ffffff50;
  pointer-events:auto
}
.stick{
  position:absolute;
  left:50%;
  top:50%;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffffffbb;
  border:3px solid #fff;
  transform:translate(-50%,-50%)
}
.actions{
  position:absolute;
  right:15px;
  bottom:18px;
  display:flex;
  align-items:end;
  gap:7px;
  pointer-events:auto
}
.action{
  width:63px;
  height:63px;
  border-radius:50%;
  border:3px solid #ffffff99;
  font-size:10px
}
.attack{
  background:#df3838;
  width:72px;
  height:72px
}
.jump{background:#278fd0}
.super{background:#8b42d6}
.locked{
  filter:grayscale(1);
  opacity:.4
}
.superBar{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:170px;
  height:10px;
  background:#071525;
  border-radius:10px;
  z-index:25;
  overflow:hidden
}
.superBar i{
  display:block;
  width:0;
  height:100%;
  background:#db4dff
}
.message{
  position:absolute;
  left:50%;
  top:58px;
  transform:translateX(-50%);
  background:#071525dd;
  padding:8px 14px;
  border-radius:12px;
  z-index:25;
  font-weight:900;
  color:#ffd83d;
  white-space:nowrap
}
.hit{
  position:absolute;
  z-index:50;
  color:#fff;
  font-size:26px;
  font-weight:1000;
  pointer-events:none;
  animation:hit .4s ease-out forwards
}
@keyframes hit{
  0%{transform:translateY(0) scale(.7);opacity:1}
  100%{transform:translateY(-55px) scale(1.2);opacity:0}
}
.boom{
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  border:9px solid #ee8cff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:40;
  pointer-events:none;
  animation:boom .6s ease-out forwards
}
@keyframes boom{
  0%{width:30px;height:30px;opacity:1}
  100%{width:450px;height:450px;opacity:0}
}
.jumpAnim{
  animation:jump .28s ease
}
@keyframes jump{
  50%{transform:translateY(-35px) scale(.9)}
}
.overlay{
  position:absolute;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100
}
.overlay.show{display:flex}
.resultBox{
  width:min(360px,90%);
  padding:25px;
  border-radius:24px;
  background:#102642;
  border:3px solid #ffd83d;
  text-align:center
}
.resultBox h1{
  font-size:34px;
  margin-bottom:10px
}
.smallBtn{
  width:100%;
  padding:13px;
  margin-top:9px;
  border-radius:12px;
  background:#1d3c5d
}
@media(max-width:600px){
  .brawlerGrid{grid-template-columns:repeat(3,1fr)}
  .brawler img{height:90px}
  .unit{width:56px;height:68px}
  .message{top:65px;font-size:12px}
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="logo">BRAWL <span>TSUKI</span></div>
  <div>
    <b id="playerName">Thalyson</b>
    <div class="trophies">🏆 <span id="trophies">1280</span></div>
  </div>
</header>

<!-- MENU -->
<section id="home" class="screen active">
<div class="home">

  <div class="hero">
    <h1>🔥 BRAWL TSUKI</h1>
    <p>Entre na arena e mostre quem é o melhor!</p>

    <button class="play" onclick="startGame()">
      🎮 JOGAR
    </button>
  </div>

  <div class="section">
    <h2>🎲 Escolha seu Brawler</h2>
    <div id="brawlerGrid" class="brawlerGrid"></div>
  </div>

</div>
</section>

<!-- JOGO -->
<section id="game" class="screen">

<div class="arena" id="arena">

  <div class="score">
    <span id="myScore">0</span> -
    <span id="enemyScore">0</span>
  </div>

  <div class="topInfo">
    ❤️ <span id="hpText">1000</span>
    <div class="hp">
      <i id="hpBar"></i>
    </div>
  </div>

  <div id="message" class="message">
    Chegue perto do inimigo!
  </div>

  <div class="goal left"></div>
  <div class="goal right"></div>

  <img id="player" class="unit">
  <img id="enemy" class="unit enemy">

  <div id="range" class="attackRange"></div>
  <div id="ball" class="ball"></div>

  <div class="controls">

    <div id="joystick" class="joystick">
      <div id="stick" class="stick"></div>
    </div>

    <div class="actions">

      <button
        id="attackButton"
        class="action attack"
        onclick="attack()">
        👊<br>ATAQUE
      </button>

      <button
        class="action jump"
        onclick="jump()">
        🦘<br>PULAR
      </button>

      <button
        id="superButton"
        class="action super locked"
        onclick="useSuper()">
        ⚡<br>SUPER
      </button>

    </div>

    <div class="superBar">
      <i id="superBar"></i>
    </div>

  </div>

</div>

<div id="result" class="overlay">
  <div class="resultBox">
    <h1 id="resultTitle">🏆 VITÓRIA!</h1>
    <p id="resultText">Você venceu!</p>
    <button class="play" onclick="startGame()">
      🔄 JOGAR NOVAMENTE
    </button>
    <button class="smallBtn" onclick="goHome()">
      🏠 MENU
    </button>
  </div>
</div>

</section>

</div>

<script>

/* =========================
   BRAWLERS
========================= */

const names=[
"Tsuki","Volt","Ghost","Blaze","Frost",
"Rex","Luna","Nova","Titan","Raven",
"Kiro","Zeta","Mako","Storm","Ninja",
"Pixel","Jade","Bolt","Skull","Flare",
"Cosmo","Viper","Rocky","Echo","Sora",
"Maxi","Zero","Onyx","Comet","Turbo",
"Myst","Ryu","Kai","Zion","Axel",
"Neko","Cyber","Inferno","Aero","Venom",
"Sonic","Omega","Hunter","Dusk","Solar",
"Argo","Phantom","Atlas","Blitz","Cobra",
"Fenix","Orbit","Giga","Drako","Moon",
"Razor","Fury","Toxic","Crystal","Meteor",
"GhostX","Darko","Lynx","Thunder","Ash",
"Samurai","Dragon","Shadow","Vortex","OmegaX"
];

const colors=[
"#36a4ff",
"#8d45e8",
"#e845a7",
"#ff9f25",
"#3dd06b"
];

function makeArt(name,index){

let c=colors[index%colors.length];

let svg=`
<svg xmlns="http://www.w3.org/2000/svg"
width="400" height="450">

<defs>
<linearGradient id="g"
x1="0" y1="0"
x2="1" y2="1">

<stop stop-color="${c}"/>
<stop offset="1"
stop-color="#101827"/>

</linearGradient>
</defs>

<rect width="400"
height="450"
rx="45"
fill="url(#g)"/>

<circle cx="200"
cy="165"
r="100"
fill="#f0c5a5"/>

<path d="
M95 150
Q200 35 305 150
Q280 75 200 75
Q120 75 95 150"
fill="#18202c"/>

<circle cx="160"
cy="165"
r="14"
fill="#111"/>

<circle cx="240"
cy="165"
r="14"
fill="#111"/>

<path d="
M150 220
Q200 250 250 220"
fill="none"
stroke="#111"
stroke-width="11"
stroke-linecap="round"/>

<path d="
M95 430
Q110 270 200 270
Q290 270 305 430"
fill="${c}"/>

<text x="200"
y="400"
text-anchor="middle"
fill="white"
font-size="27"
font-family="Arial"
font-weight="bold">
${name}
</text>

</svg>`;

return "data:image/svg+xml;charset=UTF-8,"
+encodeURIComponent(svg);
}

const brawlers=names.map((name,i)=>({
name:name,
hp:850+(i%8)*40,
damage:65+(i%9)*7,
speed:3.4+(i%6)*.2,
image:makeArt(name,i)
}));

let selected=0;

/* =========================
   MENU
========================= */

function makeBrawlers(){

let html="";

brawlers.forEach((b,i)=>{

html+=`

<div class="brawler"
onclick="selectBrawler(${i})">

<img src="${b.image}">

<b>${b.name}</b>

<small>
❤️ ${b.hp}
</small>

</div>

`;

});

document.getElementById(
"brawlerGrid"
).innerHTML=html;

}

function selectBrawler(i){

selected=i;

document.getElementById(
"playerName"
).textContent=
brawlers[i].name;

}

/* =========================
   JOGO
========================= */

let playing=false;

let px=20;
let py=50;

let ex=75;
let ey=50;

let ballX=50;
let ballY=50;

let myScore=0;
let enemyScore=0;

let hp=1000;

let enemyHp=1000;

let superHits=0;

let superReady=false;

let jumping=false;

let lastEnemyAttack=0;

function startGame(){

playing=true;

myScore=0;
enemyScore=0;

hp=1000;
enemyHp=1000;

superHits=0;
superReady=false;

px=20;
py=50;

ex=75;
ey=50;

ballX=50;
ballY=50;

document.getElementById(
"myScore"
).textContent=0;

document.getElementById(
"enemyScore"
).textContent=0;

document.getElementById(
"result"
).classList.remove("show");

document.getElementById(
"player"
).src=
brawlers[selected].image;

document.getElementById(
"enemy"
).src=
brawlers[(selected+17)%70].image;

document.getElementById(
"message"
).textContent=
"Chegue perto do inimigo!";

update();

updateSuper();

document.getElementById(
"home"
).classList.remove("active");

document.getElementById(
"game"
).classList.add("active");

}

/* =========================
   POSIÇÃO
========================= */

function update(){

let player=
document.getElementById("player");

let enemy=
document.getElementById("enemy");

let ball=
document.getElementById("ball");

player.style.left=
px+"%";

player.style.top=
py+"%";

enemy.style.left=
ex+"%";

enemy.style.top=
ey+"%";

ball.style.left=
ballX+"%";

ball.style.top=
ballY+"%";

document.getElementById(
"range"
).style.left=
(px-4)+"%";

document.getElementById(
"range"
).style.top=
(py+1)+"%";

document.getElementById(
"hpText"
).textContent=
Math.max(0,Math.floor(hp));

document.getElementById(
"hpBar"
).style.width=
Math.max(0,hp/10)+"%";

}

/* =========================
   MOVIMENTO
========================= */

function move(dx,dy){

if(!playing)return;

let speed=
brawlers[selected].speed*.22;

px+=dx*speed;
py+=dy*speed;

px=Math.max(3,Math.min(89,px));
py=Math.max(5,Math.min(82,py));

update();

}

/* =========================
   INIMIGO
========================= */

function enemyAI(){

if(!playing)return;

let dx=px-ex;
let dy=py-ey;

let distance=
Math.hypot(dx,dy);

if(distance>14){

let speed=.09;

ex+=(dx/distance)*speed;
ey+=(dy/distance)*speed;

}

if(distance<13){

enemyAttack();

}

update();

}

setInterval(enemyAI,45);

/* =========================
   ATAQUE
========================= */

function attack(){

if(!playing)return;

let distance=
Math.hypot(px-ex,py-ey);

document.getElementById(
"range"
).classList.add("show");

setTimeout(()=>{
document.getElementById(
"range"
).classList.remove("show");
},100);

if(distance>16){

message(
"❌ Muito longe!"
);

return;

}

document.getElementById(
"player"
).style.transform=
"scale(1.2)";

setTimeout(()=>{
document.getElementById(
"player"
).style.transform=
"scale(1)";
},100);

enemyHp-=
brawlers[selected].damage;

showHit(
ex,
ey,
"-"+brawlers[selected].damage
);

superHits++;

if(enemyHp<=0){

enemyHp=1000;

ex=75;
ey=Math.random()*60+20;

message(
"💥 INIMIGO DERRUBADO!"
);

}

if(superHits>=2){

superReady=true;

message(
"⚡ SUPER CARREGADA!"
);

}

updateSuper();

}

/* =========================
   ATAQUE DO INIMIGO
========================= */

function enemyAttack(){

let now=Date.now();

if(now-lastEnemyAttack<900)return;

lastEnemyAttack=now;

hp-=45;

showHit(
px,
py,
"-45"
);

message(
"👊 O inimigo te acertou!"
);

if(hp<=0){

hp=1000;

enemyScore++;

document.getElementById(
"enemyScore"
).textContent=
enemyScore;

px=20;
py=50;

message(
"💀 Você caiu!"
);

if(enemyScore>=3){

lose();

}

}

update();

}

/* =========================
   SUPER
========================= */

function updateSuper(){

let value=
Math.min(100,superHits*50);

document.getElementById(
"superBar"
).style.width=
value+"%";

document.getElementById(
"superButton"
).classList.toggle(
"locked",
!superReady
);

}

function useSuper(){

if(!playing)return;

if(!superReady){

message(
"⚡ Acerte 2 ataques para carregar!"
);

return;

}

let distance=
Math.hypot(px-ex,py-ey);

if(distance>22){

message(
"❌ Chegue perto para usar a Super!"
);

return;

}

superReady=false;
superHits=0;

updateSuper();

let boom=
document.createElement("div");

boom.className="boom";

document.getElementById(
"arena"
).appendChild(boom);

setTimeout(()=>{
boom.remove();
},650);

enemyHp-=300;

showHit(
ex,
ey,
"-300 ⚡"
);

message(
"💥 SUPER DEVASTADORA!"
);

if(enemyHp<=0){

enemyHp=1000;

ex=75;

}

update();

}

/* =========================
   PULO
========================= */

function jump(){

if(!playing||jumping)return;

jumping=true;

let player=
document.getElementById("player");

player.classList.add(
"jumpAnim"
);

setTimeout(()=>{

player.classList.remove(
"jumpAnim"
);

jumping=false;

},300);

}

/* =========================
   EFEITO DE DANO
========================= */

function showHit(x,y,text){

let el=
document.createElement("div");

el.className="hit";

el.textContent=text;

el.style.left=x+"%";
el.style.top=y+"%";

document.getElementById(
"arena"
).appendChild(el);

setTimeout(()=>{
el.remove();
},450);

}

/* =========================
   FUTEBOL
========================= */

function kickBall(){

if(!playing)return;

let distance=
Math.hypot(px-ballX,py-ballY);

if(distance>15){

message(
"⚽ Chegue perto da bola!"
);

return;

}

ballX+=
px<50?18:-18;

ballX=
Math.max(2,Math.min(98,ballX));

if(ballX>95){

myScore++;

document.getElementById(
"myScore"
).textContent=myScore;

message(
"⚽ GOOOOOOL!"
);

ballX=50;
ballY=50;

}

if(ballX<5){

enemyScore++;

document.getElementById(
"enemyScore"
).textContent=
enemyScore;

ballX=50;
ballY=50;

}

if(myScore>=3){

win();

}

if(enemyScore>=3){

lose();

}

update();

}

/* =========================
   RESULTADO
========================= */

function win(){

playing=false;

document.getElementById(
"resultTitle"
).textContent=
"🏆 VITÓRIA!";

document.getElementById(
"resultText"
).textContent=
"Você venceu a partida! +10 🏆";

document.getElementById(
"result"
).classList.add("show");

let trophies=
Number(
document.getElementById(
"trophies"
).textContent
)+10;

document.getElementById(
"trophies"
).textContent=
trophies;

localStorage.trophies=trophies;

}

function lose(){

playing=false;

document.getElementById(
"resultTitle"
).textContent=
"💀 DERROTA";

document.getElementById(
"resultText"
).textContent=
"O inimigo venceu!";

document.getElementById(
"result"
).classList.add("show");

}

/* =========================
   MENSAGEM
========================= */

function message(text){

document.getElementById(
"message"
).textContent=text;

}

/* =========================
   MENU
========================= */

"game"

/* =========================
   ANALÓGICO
========================= */

let active=false;

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

joystick.addEventListener(
"pointerdown",
e=>{

active=true;

joystick.setPointerCapture(
e.pointerId
);

analog(e);

}
);

joystick.addEventListener(
"pointermove",
e=>{

if(active){

analog(e);

}

}
);

joystick.addEventListener(
"pointerup",
()=>{

active=false;

stick.style.left="50%";
stick.style.top="50%";

}
);

function analog(e){

let rect=
joystick.getBoundingClientRect();

let x=
e.clientX-
rect.left-
rect.width/2;

let y=
e.clientY-
rect.top-
rect.height/2;

let max=35;

let distance=
Math.hypot(x,y);

if(distance>max){

x=x/distance*max;
y=y/distance*max;

}

stick.style.left=
"calc(50% + "+x+"px)";

stick.style.top=
"calc(50% + "+y+"px)";

if(distance>8){

move(
x/max,
y/max
);

}

}

/* =========================
   TECLADO
========================= */

document.addEventListener(
"keydown",
e=>{

if(e.key==="w"||
e.key==="ArrowUp")
move(0,-1);

if(e.key==="s"||
e.key==="ArrowDown")
move(0,1);

if(e.key==="a"||
e.key==="ArrowLeft")
move(-1,0);

if(e.key==="d"||
e.key==="ArrowRight")
move(1,0);

if(e.key===" ")
jump();

if(e.key==="e")
attack();

if(e.key==="q")
useSuper();

}
);
