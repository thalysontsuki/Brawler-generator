<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brawler Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    padding: 25px 12px;

    background:
        radial-gradient(circle at top, #5b21b6, transparent 45%),
        linear-gradient(135deg, #101020, #171735);
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

h1 {
    font-size: 36px;
    margin: 5px 0;
    text-shadow: 0 4px 0 #000;
}

.subtitle {
    color: #ddd;
    margin-bottom: 20px;
}

button {
    border: 0;
    border-radius: 15px;
    padding: 16px 22px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: linear-gradient(#ffcf33, #ff7b00);
    box-shadow: 0 6px 0 #9b4300;
    cursor: pointer;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #9b4300;
}

.card {
    margin-top: 25px;
    padding: 22px;
    border-radius: 25px;
    background: linear-gradient(145deg, #292950, #15152d);
    border: 3px solid #ffffff22;
    box-shadow: 0 12px 35px #0008;
    animation: aparecer .4s ease;
}

.hidden {
    display: none;
}

.foto-brawler {
    width: 200px;
    height: 200px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
    filter: drop-shadow(0 8px 8px #000);
}

.nome {
    font-size: 36px;
    font-weight: 900;
    text-shadow: 0 4px 0 #000;
}

.raridade {
    display: inline-block;
    margin: 8px 0 20px;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    background: #8b5cf6;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat {
    background: #ffffff12;
    border-radius: 15px;
    padding: 15px 8px;
}

.stat span {
    display: block;
    font-size: 27px;
}

.stat b {
    color: #ddd;
}

.section {
    margin-top: 20px;
    text-align: left;
    padding: 15px;
    background: #ffffff0d;
    border-radius: 15px;
}

.section h3 {
    margin-top: 0;
    color: #ffd43b;
}

.section p {
    line-height: 1.5;
}

.tipo {
    margin-top: 18px;
    font-weight: bold;
    color: #66e3ff;
}

.creditos {
    margin-top: 22px;
    color: #aaa;
    font-size: 13px;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 BRAWLER GENERATOR</h1>

<div class="subtitle">
Crie seu próprio Brawler!
</div>

<button onclick="gerarBrawler()">
⚡ GERAR NOVO BRAWLER ⚡
</button>

<div id="card" class="card hidden">

<img id="fotoBrawler"
     class="foto-brawler"
     src=""
     alt="Brawler">

<div id="nome" class="nome"></div>

<div id="raridade" class="raridade"></div>

<div class="stats">

<div class="stat">
<span>❤️</span>
<b>VIDA</b>
<div id="vida"></div>
</div>

<div class="stat">
<span>⚔️</span>
<b>ATAQUE</b>
<div id="ataque"></div>
</div>

<div class="stat">
<span>🛡️</span>
<b>DEFESA</b>
<div id="defesa"></div>
</div>

<div class="stat">
<span>⚡</span>
<b>VELOCIDADE</b>
<div id="velocidade"></div>
</div>

</div>

<div class="section">
<h3>🔥 Ataque</h3>
<p id="especial"></p>
</div>

<div class="section">
<h3>💥 Super</h3>
<p id="super"></p>
</div>

<div class="section">
<h3>🟢 Poder de Estrela</h3>
<p id="passivo"></p>
</div>

<div class="tipo">
🎭 Tipo: <span id="tipo"></span>
</div>

</div>

<div class="creditos">
Criado por Thalyson e ChatGPT ❤️
</div>

</div>

<script>

const brawlers = [

{
nome: "Mortis",
raridade: "Mítico",
tipo: "Algoz",
vida: 8000,
ataque: 1800,
defesa: 65,
velocidade: 95,

foto: "mortis.png",

especial:
"Mortis avança para frente com sua pá, causando dano aos inimigos no caminho.",

super:
"Mortis lança uma onda de morcegos que causa dano e recupera sua vida.",

passivo:
"Coleta Sinistra: Mortis recupera vida ao derrotar um inimigo."
},

{

nome: "Pierce",
raridade: "Lendário",
tipo: "Atirador",
vida: 6400,
ataque: 2100,
defesa: 55,
velocidade: 75,

foto: "pierce.png",

especial:
"Pierce dispara projéteis que podem atravessar Brawlers.",

super:
"Pierce dispara duas ondas de projéteis contra seus inimigos.",

passivo:
"Seus ataques podem atingir vários inimigos em sequência."
},

{

nome: "Sirius",
raridade: "Ultra Lendário",
tipo: "Controlador",
vida: 3400,
ataque: 1800,
defesa: 60,
velocidade: 72,

foto: "sirius.png",

especial:
"Sirius dispara dois projéteis: uma bomba que causa dano em área e um ataque direto.",

super:
"Sirius invoca Sombras de Brawlers derrotados para lutar ao seu lado.",

passivo:
"A cada quarto acerto, Sirius pode armazenar uma Sombra."
}

];

function aleatorio(lista) {

return lista[
Math.floor(Math.random() * lista.length)
];

}

function gerarBrawler() {

const card = document.getElementById("card");

card.classList.remove("hidden");

card.style.animation = "none";

void card.offsetWidth;

card.style.animation = "aparecer .4s ease";

const brawler = aleatorio(brawlers);

document.getElementById("fotoBrawler").src =
brawler.foto;

document.getElementById("nome").textContent =
brawler.nome;

document.getElementById("raridade").textContent =
brawler.raridade;

document.getElementById("vida").textContent =
brawler.vida;

document.getElementById("ataque").textContent =
brawler.ataque;

document.getElementById("defesa").textContent =
brawler.defesa;

document.getElementById("velocidade").textContent =
brawler.velocidade;

document.getElementById("especial").textContent =
brawler.especial;

document.getElementById("super").textContent =
brawler.super;

document.getElementById("passivo").textContent =
brawler.passivo;

document.getElementById("tipo").textContent =
brawler.tipo;

}

</script>

</body>
</html>
