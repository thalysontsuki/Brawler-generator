<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tsuki RPG</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
font-family:Arial,sans-serif;
background:#070b11;
color:#fff;
touch-action:none;
user-select:none
}
button{font:inherit;border:0;cursor:pointer;color:#fff}
.hidden{display:none!important}

.screen{
position:absolute;
inset:0;
display:none;
overflow:hidden
}
.screen.active{display:block}

/* MENU */
#menu{
background:
linear-gradient(#0005,#000b),
radial-gradient(circle at 50% 25%,#49677d,#121b27 60%,#070a0f)
}
.menuContent{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(430px,92%);
text-align:center;
padding:25px;
background:#0b111be8;
border:1px solid #ffffff22;
border-radius:25px;
box-shadow:0 20px 70px #000
}
.logo{
font-size:48px;
font-weight:1000;
letter-spacing:3px;
color:#d9ad4c;
text-shadow:0 4px 0 #34250d
}
.tagline{color:#aeb8c5;margin:5px 0 20px}
.hero{
width:190px;
height:245px;
object-fit:contain;
display:block;
margin:0 auto 15px
}
.menuBtn{
width:100%;
padding:15px;
margin-top:9px;
border-radius:13px;
background:linear-gradient(#35516d,#1c2d40);
border:1px solid #ffffff22;
font-weight:900
}
.menuBtn.main{
background:linear-gradient(#e0bd5e,#9a681e);
color:#171109;
font-size:19px
}
.menuBtn:active{transform:scale(.98)}

/* WORLD */
#world{
background:
linear-gradient(120deg,#162b1d,#315b35 45%,#1b3223)
}
.skyLight{
position:absolute;
width:600px;
height:600px;
left:50%;
top:-300px;
transform:translateX(-50%);
background:radial-gradient(circle,#ffffff18,transparent 65%);
pointer-events:none
}
.ground{
position:absolute;
inset:0;
background-image:
radial-gradient(#b6c87922 1px,transparent 1px);
background-size:35px 35px
}
.path{
position:absolute;
width:140%;
height:145px;
left:-20%;
top:49%;
transform:rotate(-8deg);
background:#806c4e;
box-shadow:0 0 25px #0005
}
.path:after{
content:"";
position:absolute;
inset:15px 0;
background:#947d5a;
opacity:.35
}
.tree{
position:absolute;
width:90px;
height:115px
}
.tree:before{
content:"";
position:absolute;
width:20px;
height:52px;
bottom:0;
left:35px;
background:#4b3321;
border-radius:8px
}
.tree:after{
content:"";
position:absolute;
width:76px;
height:76px;
left:7px;
top:0;
border-radius:50%;
background:#163f25;
box-shadow:
35px 10px 0 #22592f,
20px -18px 0 #2c6a39
}
.rock{
position:absolute;
width:55px;
height:30px;
border-radius:50%;
background:#53606a;
box-shadow:inset -8px -5px #303940
}

/* HUD */
#hud{
position:absolute;
top:0;
left:0;
right:0;
height:74px;
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
padding:8px 12px;
background:#080e16dd;
border-bottom:1px solid #ffffff18
}
.profile{
display:flex;
gap:8px;
align-items:center
}
.avatar{
width:50px;
height:50px;
border-radius:13px;
background:#182636;
object-fit:contain
}
.name{font-weight:900}
.small{font-size:12px;color:#9eabba}
.resources{text-align:right;font-size:13px;line-height:20px}
.gold{color:#ffd55e}

/* PLAYER */
.character{
position:absolute;
width:92px;
height:120px;
object-fit:contain;
z-index:10;
transform:translate(-50%,-50%);
transition:left .05s linear,top .05s linear
}
.enemy{z-index:9}

/* TARGET */
.enemyBar{
position:absolute;
top:88px;
left:50%;
transform:translateX(-50%);
width:190px;
height:9px;
background:#250d12;
border-radius:8px;
overflow:hidden;
z-index:25
}
.enemyFill{height:100%;width:100%;background:#d83e4b}

/* CONTROLS */
#controls{position:absolute;inset:0;z-index:30;pointer-events:none}
.joystick{
position:absolute;
left:18px;
bottom:18px;
width:108px;
height:108px;
border-radius:50%;
background:#ffffff15;
border:3px solid #ffffff35;
pointer-events:auto
}
.knob{
position:absolute;
left:50%;
top:50%;
width:50px;
height:50px;
border-radius:50%;
transform:translate(-50%,-50%);
background:#dbe4ecaa;
border:3px solid #fff
}
.actions{
position:absolute;
right:14px;
bottom:15px;
display:flex;
gap:8px;
align-items:flex-end;
pointer-events:auto
}
.act{
width:63px;
height:63px;
border-radius:50%;
border:2px solid #ffffff55;
background:#344e69;
font-size:11px;
font-weight:900;
box-shadow:0 5px 12px #0007
}
.act.attack{width:75px;height:75px;background:#a9363d}
.act.magic{background:#5a49a1}
.act.heal{background:#287b4c}

/* PANELS */
.overlay{
position:absolute;
inset:0;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:15px;
background:#000b
}
.overlay.open{display:flex}
.panel{
width:min(440px,100%);
max-height:90vh;
overflow:auto;
padding:18px;
background:#101a27;
border:1px solid #ffffff20;
border-radius:22px;
box-shadow:0 20px 70px #000
}
.panel h2{
color:#e2bd61;
margin-bottom:14px
}
.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:11px;
margin:7px 0;
background:#19283a;
border-radius:11px
}
.row button{
padding:8px 10px;
border-radius:8px;
background:#3b5874
}
.close{
width:100%;
padding:13px;
margin-top:12px;
border-radius:10px;
background:#69333a
}
.devInput{
width:100%;
padding:11px;
background:#080e16;
color:#fff;
border:1px solid #ffffff20;
border-radius:8px;
margin:5px 0 10px
}
.rarity{
font-size:11px;
color:#d8b45b
}

/* NOTIFICATION */
#notice{
position:absolute;
left:50%;
bottom:145px;
transform:translateX(-50%);
z-index:80;
padding:10px 15px;
background:#08111ddd;
border:1px solid #ffffff18;
border-radius:12px;
opacity:0;
pointer-events:none;
transition:.2s
}
#notice.show{opacity:1}

/* DAMAGE */
.damage{
position:absolute;
z-index:70;
font-size:25px;
font-weight:1000;
color:#ffe16b;
animation:floatDamage .6s forwards;
pointer-events:none
}
@keyframes floatDamage{
to{transform:translateY(-55px);opacity:0}
}

/* BATTLE FLASH */
.flash{
animation:flash .16s
}
@keyframes flash{
50%{filter:brightness(2)}
}

/* RESPONSIVE */
@media(max-width:500px){
.logo{font-size:38px}
.character{width:78px;height:105px}
}
</style>
</head>

<body>

<!-- MENU -->
<section id="menu" class="screen active">
<div class="menuContent">

<div class="logo">TSUKI RPG</div>
<div class="tagline">Aventura • Combate • Fantasia</div>

<img id="heroMenu" class="hero">

<button class="menuBtn main" onclick="startGame()">
⚔️ COMEÇAR AVENTURA
</button>

<button class="menuBtn" onclick="openInventory()">
🎒 INVENTÁRIO
</button>

<button class="menuBtn" onclick="openDev()">
🛠️ DESENVOLVEDOR
</button>

</div>
</section>


<!-- WORLD -->
<section id="world" class="screen">

<div class="skyLight"></div>
<div class="ground"></div>
<div class="path"></div>

<div class="tree" style="left:4%;top:17%"></div>
<div class="tree" style="left:80%;top:13%"></div>
<div class="tree" style="left:12%;top:72%"></div>
<div class="tree" style="left:83%;top:70%"></div>

<div class="rock" style="left:28%;top:30%"></div>
<div class="rock" style="left:65%;top:33%"></div>
<div class="rock" style="left:45%;top:76%"></div>


<!-- HUD -->
<div id="hud">

<div class="profile">
<img id="avatar" class="avatar">
<div>
<div id="playerName" class="name">Aventureiro</div>
<div class="small">
Nível <span id="level">1</span> • XP <span id="xp">0</span>
</div>
</div>
</div>

<div class="resources">
<div>❤️ <span id="hp">100</span>/<span id="maxHp">100</span></div>
<div class="gold">💰 <span id="gold">100</span></div>
</div>

</div>


<div id="enemyBar" class="enemyBar hidden">
<div id="enemyFill" class="enemyFill"></div>
</div>


<img id="player" class="character">
<img id="enemy" class="character enemy hidden">


<!-- CONTROLES -->
<div id="controls">

<div id="joystick" class="joystick">
<div id="knob" class="knob"></div>
</div>

<div class="actions">

<button class="act heal" onclick="heal()">
❤️<br>CURA
</button>

<button class="act magic" onclick="magicAttack()">
✨<br>MAGIA
</button>

<button class="act attack" onclick="attack()">
⚔️<br>ATACAR
</button>

</div>
</div>

<div id="notice"></div>

</section>


<!-- INVENTORY -->
<div id="inventoryOverlay" class="overlay">

<div class="panel">

<h2>🎒 Inventário</h2>

<div id="inventoryList"></div>

<button class="close" onclick="closePanels()">
FECHAR
</button>

</div>
</div>


<!-- DEV -->
<div id="devOverlay" class="overlay">

<div class="panel">

<h2>🛠️ Modo Desenvolvedor</h2>

<p class="small">
Ferramentas para testar o jogo.
</p>

<br>

<label>💰 Moedas</label>
<input id="devGold" class="devInput" type="number" value="500">

<button class="menuBtn" onclick="devGold()">
ADICIONAR MOEDAS
</button>


<br><br>

<label>📈 Nível</label>
<input id="devLevel" class="devInput" type="number" value="10">

<button class="menuBtn" onclick="devLevel()">
ALTERAR NÍVEL
</button>


<br><br>

<button class="menuBtn" onclick="fullHeal()">
❤️ VIDA MÁXIMA
</button>

<button class="menuBtn" onclick="spawnEnemy()">
👾 CRIAR INIMIGO
</button>

<button class="menuBtn" onclick="giveAllWeapons()">
⚔️ LIBERAR TODAS AS ARMAS
</button>

<button class="menuBtn" onclick="closePanels()">
VOLTAR
</button>

</div>
</div>


<script>

/* =========================
   PERSONAGEM
========================= */

function heroSVG(){

let svg=`
<svg xmlns="http://www.w3.org/2000/svg"
width="300" height="420">

<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#507eb2"/>
<stop offset="1" stop-color="#17283e"/>
</linearGradient>
</defs>

<ellipse cx="150" cy="392"
rx="88" ry="17" fill="#0007"/>

<!-- pernas -->
<path d="M105 275v100h34l12-95"
fill="#202c3d"/>
<path d="M151 280l14 95h34l-8-100"
fill="#202c3d"/>

<!-- capa -->
<path d="M92 182Q50 250 76 327
Q105 310 120 285V180"
fill="#4a2029"/>

<!-- corpo -->
<path d="M88 178Q150 145 212 178
L204 285Q150 310 96 285Z"
fill="url(#a)"
stroke="#101722"
stroke-width="8"/>

<!-- pescoço -->
<rect x="133" y="132"
width="34" height="48" rx="9"
fill="#d59d7b"/>

<!-- cabeça -->
<circle cx="150" cy="102"
r="65" fill="#dfaa86"
stroke="#111"
stroke-width="7"/>

<!-- cabelo -->
<path d="M88 105Q78 25 150 22
Q220 22 214 110L188 70
L168 93L145 60L120 98
L100 73Z"
fill="#20242a"/>

<!-- olhos -->
<circle cx="125" cy="112" r="8" fill="#17202b"/>
<circle cx="175" cy="112" r="8" fill="#17202b"/>

<!-- nariz -->
<path d="M150 116l-8 20h15"
fill="none" stroke="#9a6b58" stroke-width="5"/>

<!-- boca -->
<path d="M130 151q20 12 40 0"
fill="none" stroke="#713e3a" stroke-width="5"/>

<!-- braço -->
<path d="M95 192Q52 230 68 272"
fill="none" stroke="#355f8c"
stroke-width="27" stroke-linecap="round"/>

<!-- espada -->
<path d="M69 270L19 200"
stroke="#dfe5ea" stroke-width="14"/>
<path d="M48 251L76 228"
stroke="#9a682f" stroke-width="13"/>

</svg>`;

return "data:image/svg+xml;charset=utf-8,"+
encodeURIComponent(svg);
}


/* =========================
   INIMIGO
========================= */

function enemySVG(){

let svg=`
<svg xmlns="http://www.w3.org/2000/svg"
width="300" height="420">

<ellipse cx="150" cy="392"
rx="95" ry="18" fill="#0008"/>

<path d="M78 190Q150 150 222 190
L208 310Q150 335 92 310Z"
fill="#6e2930"
stroke="#111"
stroke-width="9"/>

<circle cx="150" cy="105"
r="67" fill="#8e604e"
stroke="#111" stroke-width="8"/>

<path d="M84 105Q95 20 150 24
Q215 20 220 108
L185 70L160 96L130 65L105 102Z"
fill="#111"/>

<circle cx="124" cy="115"
r="10" fill="#ff3d48"/>

<circle cx="176" cy="115"
r="10" fill="#ff3d48"/>

<path d="M120 156Q150 176 180 156"
fill="none" stroke="#321318"
stroke-width="8"/>

</svg>`;

return "data:image/svg+xml;charset=utf-8,"+
encodeURIComponent(svg);
}


/* =========================
   DADOS
========================= */

const weapons=[
{name:"Espada de Ferro",damage:20,rarity:"Comum"},
{name:"Machado do Guardião",damage:35,rarity:"Raro"},
{name:"Arco Lunar",damage:45,rarity:"Épico"},
{name:"Cajado Arcano",damage:55,rarity:"Mítico"},
{name:"Lança Sombria",damage:70,rarity:"Lendário"},
{name:"Espada do Rei",damage:100,rarity:"Lendário"}
];

let player={
name:"Aventureiro",
level:1,
xp:0,
gold:100,
hp:100,
maxHp:100,
weapon:weapons[0],
inventory:[weapons[0].name]
};

let enemy={
alive:false,
hp:100,
maxHp:100,
damage:8
};

let px=50;
let py=58;
let enemyX=72;
let enemyY=52;
let playing=false;


/* =========================
   INICIALIZAÇÃO
========================= */

const art=heroSVG();

document.getElementById("heroMenu").src=art;
document.getElementById("avatar").src=art;
document.getElementById("player").src=art;


/* =========================
   START
========================= */

function startGame(){

playing=true;

document.getElementById("menu")
.classList.remove("active");

document.getElementById("world")
.classList.add("active");

updatePlayer();
updateHUD();

notice("⚔️ A aventura começou!");

}


/* =========================
   MOVIMENTO
========================= */

function move(x,y){

if(!playing)return;

const speed=.18;

px+=x*speed;
py+=y*speed;

px=Math.max(5,Math.min(95,px));
py=Math.max(12,Math.min(90,py));

updatePlayer();

}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

const p=document.getElementById("player");

p.style.left=px+"%";
p.style.top=py+"%";

}


/* =========================
   INIMIGO
========================= */

function spawnEnemy(){

enemy.alive=true;
enemy.hp=enemy.maxHp;

const el=document.getElementById("enemy");

el.src=enemySVG();
el.classList.remove("hidden");

document.getElementById("enemyBar")
.classList.remove("hidden");

enemyX=72;
enemyY=52;

updateEnemy();

notice("👾 Um inimigo apareceu!");

}


function updateEnemy(){

const e=document.getElementById("enemy");

e.style.left=enemyX+"%";
e.style.top=enemyY+"%";

document.getElementById("enemyFill")
.style.width=
Math.max(0,enemy.hp/enemy.maxHp*100)+"%";

}


/* =========================
   INIMIGO SE MOVE
========================= */

setInterval(()=>{

if(!playing||!enemy.alive)return;

let dx=px-enemyX;
let dy=py-enemyY;

let d=Math.hypot(dx,dy);

if(d>13){

enemyX+=dx/d*.055;
enemyY+=dy/d*.055;

updateEnemy();

}else{

enemyHitPlayer();

}

},70);

let lastHit=0;

function enemyHitPlayer(){

let now=Date.now();

if(now-lastHit<900)return;

lastHit=now;

player.hp-=enemy.damage;

if(player.hp<0)player.hp=0;

damageText(px,py,"-"+enemy.damage);

updateHUD();

if(player.hp<=0){

notice("💀 Você foi derrotado!");

player.hp=player.maxHp;

px=50;
py=58;

updatePlayer();
updateHUD();

}

}


/* =========================
   ATAQUE
========================= */

function attack(){

if(!playing)return;

if(!enemy.alive){

notice("Não há inimigo para atacar.");

return;

}

let d=Math.hypot(
px-enemyX,
py-enemyY
);

if(d>16){

notice("⚔️ Chegue mais perto!");

return;

}

const damage=player.weapon.damage;

enemy.hp-=damage;

const p=document.getElementById("player");
const e=document.getElementById("enemy");

p.classList.add("flash");
e.classList.add("flash");

setTimeout(()=>{
p.classList.remove("flash");
e.classList.remove("flash");
},160);

damageText(
enemyX,
enemyY,
"-"+damage
);

updateEnemy();

if(enemy.hp<=0)
defeatEnemy();

}


/* =========================
   MAGIA
========================= */

function magicAttack(){

if(!playing)return;

if(!enemy.alive){

notice("✨ Nenhum inimigo.");

return;

}

let d=Math.hypot(
px-enemyX,
py-enemyY
);

if(d>45){

notice("✨ O inimigo está longe demais.");

return;

}

let damage=45;

enemy.hp-=damage;

damageText(
enemyX,
enemyY,
"-"+damage+" ✨"
);

updateEnemy();

if(enemy.hp<=0)
defeatEnemy();

}


/* =========================
   CURA
========================= */

function heal(){

if(player.hp>=player.maxHp){

notice("❤️ Sua vida já está cheia.");

return;

}

player.hp=Math.min(
player.maxHp,
player.hp+30
);

updateHUD();

notice("💚 Você recuperou vida!");

}


/* =========================
   DERROTA
========================= */

function defeatEnemy(){

enemy.alive=false;

document.getElementById("enemy")
.classList.add("hidden");

document.getElementById("enemyBar")
.classList.add("hidden");

player.gold+=25;
player.xp+=50;

levelCheck();

updateHUD();

notice("🏆 Inimigo derrotado! +50 XP");

}


/* =========================
   XP
========================= */

function levelCheck(){

let need=player.level*100;

if(player.xp>=need){

player.xp-=need;
player.level++;

player.maxHp+=20;
player.hp=player.maxHp;

notice(
"🎉 NÍVEL "+player.level+"!"
);

}

}


/* =========================
   HUD
========================= */

function updateHUD(){

document.getElementById("playerName")
.textContent=player.name;

document.getElementById("level")
.textContent=player.level;

document.getElementById("xp")
.textContent=player.xp;

document.getElementById("hp")
.textContent=Math.floor(player.hp);

document.getElementById("maxHp")
.textContent=player.maxHp;

document.getElementById("gold")
.textContent=player.gold;

}


/* =========================
   INVENTÁRIO
========================= */

function openInventory(){

const list=document.getElementById(
"inventoryList"
);

list.innerHTML="";

player.inventory.forEach(name=>{

const w=weapons.find(
x=>x.name===name
);

const row=document.createElement("div");

row.className="row";

row.innerHTML=`
<div>
<b>${w.name}</b>
<div class="rarity">
${w.rarity} • ⚔️ ${w.damage}
</div>
</div>
<button>USAR</button>
`;

row.querySelector("button")
.onclick=()=>equip(w);

list.appendChild(row);

});

document.getElementById(
"inventoryOverlay"
).classList.add("open");

}


function equip(w){

player.weapon=w;

notice("⚔️ Equipado: "+w.name);

closePanels();

}


/* =========================
   DESENVOLVEDOR
========================= */

function openDev(){

const password=prompt(
"Senha do desenvolvedor:"
);

if(password!=="tsuki123"){

alert("❌ Senha incorreta.");

return;

}

document.getElementById(
"devOverlay"
).classList.add("open");

}


function devGold(){

let amount=Number(
document.getElementById("devGold").value
);

if(!amount)return;

player.gold+=amount;

updateHUD();

notice("💰 +"+amount);

}


function devLevel(){

let level=Number(
document.getElementById("devLevel").value
);

if(level<1)level=1;

player.level=level;
player.maxHp=100+(level-1)*20;
player.hp=player.maxHp;

updateHUD();

notice("📈 Nível alterado.");

}


function fullHeal(){

player.hp=player.maxHp;

updateHUD();

notice("❤️ Vida restaurada.");

}


function giveAllWeapons(){

weapons.forEach(w=>{

if(!player.inventory.includes(w.name))
player.inventory.push(w.name);

});

notice("⚔️ Todas as armas liberadas!");

}


/* =========================
   FECHAR
========================= */

function closePanels(){

document.querySelectorAll(".overlay")
.forEach(x=>x.classList.remove("open"));

}


/* =========================
   NOTIFICAÇÃO
========================= */

let noticeTimer;

function notice(text){

const n=document.getElementById("notice");

n.textContent=text;

n.classList.add("show");

clearTimeout(noticeTimer);

noticeTimer=setTimeout(()=>{
n.classList.remove("show");
},1800);

}


/* =========================
   DANO
========================= */

function damageText(x,y,text){

const d=document.createElement("div");

d.className="damage";
d.textContent=text;

d.style.left=x+"%";
d.style.top=y+"%";

document.getElementById("world")
.appendChild(d);

setTimeout(()=>d.remove(),600);

}


/* =========================

const joy=document.getElementById("joystick");
const knob=document.getElementById("knob");

let dragging=false;

joy.addEventListener("pointerdown",e=>{

dragging=true;
joy.setPointerCapture(e.pointerId);
analog(e);

});

joy.addEventListener("pointermove",e=>{

if(dragging)analog(e);

});

joy.addEventListener("pointerup",()=>{

dragging=false;

knob.style.left="50%";
knob.style.top="50%";

});


function analog(e){

const r=joy.getBoundingClientRect();

let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;

const max=36;

let d=Math.hypot(x,y);

if(d>max){

x=x/d*max;
y=y/d*max;

}

knob.style.left=
"calc(50% + "+x+"px)";

knob.style.top=
"calc(50% + "+y+"px)";

if(d>7){

move(x/max,y/max);

}

}
