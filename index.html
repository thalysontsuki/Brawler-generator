<h1>Bandeiras do Mundo</h1>
<button onclick="mostrarBandeiras()">TOQUE AQUI PRA VER TODAS AS BANDEIRAS DO MUNDO</button>
<div id="bandeiras"></div>

<script>
  async function mostrarBandeiras() {
    const resposta = await fetch("https://restcountries.com/v3.1/all");
    const paises = await resposta.json();

    const container = document.getElementById("bandeiras");
    container.innerHTML = ""; // limpa antes de carregar

    paises.forEach(pais => {
      const div = document.createElement("div");
      div.style.margin = "10px";
      div.style.display = "inline-block";
      div.style.textAlign = "center";

      const img = document.createElement("img");
      img.src = pais.flags.png;
      img.alt = pais.name.common;
      img.style.width = "100px";

      const nome = document.createElement("p");
      nome.textContent = pais.name.common;

      div.appendChild(img);
      div.appendChild(nome);
      container.appendChild(div);
    });
  }
</script>
