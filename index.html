<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bandeiras do Mundo</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #2563eb;
      color: white;
      transition: background 0.3s;
      margin-bottom: 20px;
    }

    button:hover {
      background-color: #1e40af;
    }

    #bandeiras {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 6px;
    }

    .card p {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bandeiras do Mundo</h1>
  </header>
  <main>
    <button onclick="mostrarBandeiras()">Carregar Bandeiras</button>
    <div id="bandeiras"></div>
  </main>

  <script>
    async function mostrarBandeiras() {
      try {
        const resposta = await fetch("https://restcountries.com/v3.1/all");
        const paises = await resposta.json();

        const container = document.getElementById("bandeiras");
        container.innerHTML = "";

        paises.forEach(pais => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = pais.flags.png;
          img.alt = pais.name.common;

          const nome = document.createElement("p");
          nome.textContent = pais.name.common;

          card.appendChild(img);
          card.appendChild(nome);
          container.appendChild(card);
        });
      } catch (erro) {
        alert("Erro ao carregar bandeiras: " + erro);
      }
    }
  </script>
</body>
</html>
