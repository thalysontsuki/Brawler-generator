<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawler Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    padding: 25px 12px;
    background:
        radial-gradient(circle at top, #5b21b6, transparent 45%),
        linear-gradient(135deg, #101020, #171735);
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

h1 {
    font-size: 36px;
    margin: 5px 0;
    text-shadow: 0 4px 0 #000;
}

.subtitle {
    color: #ddd;
    margin-bottom: 20px;
}

button {
    border: 0;
    border-radius: 15px;
    padding: 16px 22px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: linear-gradient(#ffcf33, #ff7b00);
    box-shadow: 0 6px 0 #9b4300;
    cursor: pointer;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #9b4300;
}

.card {
    margin-top: 25px;
    padding: 22px;
    border-radius: 25px;
    background: linear-gradient(145deg, #292950, #15152d);
    border: 3px solid #ffffff22;
    box-shadow: 0 12px 35px #0008;
    animation: aparecer .4s ease;
}

.hidden {
    display: none;
}

.personagem {
    width: 180px;
    height: 180px;
    margin: 0 auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
    background: linear-gradient(135deg, #ffcf33, #ff5e00);
    border: 5px solid white;
    box-shadow: 0 8px 20px #000;
}

.nome {
    font-size: 36px;
    font-weight: 900;
    text-shadow: 0 4px 0 #000;
}

.raridade {
    display: inline-block;
    margin: 8px 0 20px;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    background: #8b5cf6;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat {
    background: #ffffff12;
    border-radius: 15px;
    padding: 15px 8px;
}

.stat span {
    display: block;
    font-size: 27px;
}

.stat b {
    color: #ddd;
}

.section {
    margin-top: 20px;
    text-align: left;
    padding: 15px;
    background: #ffffff0d;
    border-radius: 15px;
}

.section h3 {
    margin-top: 0;
    color: #ffd43b;
}

.section p {
    line-height: 1.5;
}

.tipo {
    margin-top: 18px;
    font-weight: bold;
    color: #66e3ff;
}

.creditos {
    margin-top: 22px;
    color: #aaa;
    font-size: 13px;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(.8) rotate(-5deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 BRAWLER GENERATOR</h1>

<div class="subtitle">
Crie seu próprio Brawler!
</div>

<button onclick="gerarBrawler()">
⚡ GERAR NOVO BRAWLER ⚡
</button>

<div id="card" class="card hidden">

<div id="personagem" class="personagem">🥊</div>

<div id="nome" class="nome"></div>

<div id="raridade" class="raridade"></div>

<div class="stats">

<div class="stat">
<span>❤️</span>
<b>VIDA</b>
<div id="vida"></div>
</div>

<div class="stat">
<span>⚔️</span>
<b>ATAQUE</b>
<div id="ataque"></div>
</div>

<div class="stat">
<span>🛡️</span>
<b>DEFESA</b>
<div id="defesa"></div>
</div>

<div class="stat">
<span>⚡</span>
<b>VELOCIDADE</b>
<div id="velocidade"></div>
</div>

</div>

<div class="section">
<h3>🔥 Ataque</h3>

</div>

<div class="section">

</div>

<div class="section">

</div>

<div class="tipo">
🎭 Tipo: <span id="tipo"></span>

</div>

<div class="creditos">
Criado por Thalyson e ChatGPT ❤️

function aleatorio(lista) {

return lista[
Math.floor(Math.random() * lista.length)
];

}

function gerarBrawler() {

const card = document.getElementById("card");

card.classList.remove("hidden");

card.style.animation = "none";

void card.offsetWidth;

card.style.animation = "aparecer .4s ease";

const brawler = aleatorio(brawlers);

document.getElementById("personagem").textContent =
brawler.emoji;

document.getElementById("nome").textContent =
