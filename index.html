<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brawl Tsuki 3.0 - Meu Perfil</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #151515, #242424);
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      color: #bbb;
      margin-bottom: 25px;
    }

    .busca {
      background: #202020;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 8px 25px #0008;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 17px;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #f5c400;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #status {
      text-align: center;
      margin: 18px 0;
      color: #ccc;
    }

    .perfil {
      display: none;
      margin-top: 20px;
    }

    .card {
      background: #202020;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px #0007;
    }

    .nome {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .tag {
      color: #aaa;
      margin-bottom: 15px;
    }

    .estatisticas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .estatistica {
      background: #303030;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .numero {
      display: block;
      font-size: 25px;
      font-weight: bold;
    }

    .titulo {
      color: #aaa;
      font-size: 13px;
    }

    .brawlers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .brawler {
      background: #303030;
      padding: 13px;
      border-radius: 12px;
    }

    .brawler strong {
      display: block;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .erro {
      color: #ff6666 !important;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .estatisticas,
      .brawlers {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔥 BRAWL TSUKI</h1>

    <p class="subtitulo">
      Veja seu próprio perfil do Brawl Stars
    </p>

    <div class="busca">

      <label for="tag">Digite sua tag:</label>

      <input
        id="tag"
        type="text"
        placeholder="#ABC123"
        maxlength="20"
      >

      <button onclick="buscarPerfil()">
        🔎 VER MEU PERFIL
      </button>

    </div>

    <p id="status"></p>

    <div id="perfil" class="perfil">

      <div class="card">

        <div id="nome" class="nome">
          Jogador
        </div>

        <div id="tagJogador" class="tag">
          #XXXXXXXX
        </div>

        <div class="estatisticas">

          <div class="estatistica">
            <span id="trofeus" class="numero">0</span>
            <span class="titulo">🏆 Troféus</span>
          </div>

          <div class="estatistica">
            <span id="recorde" class="numero">0</span>
            <span class="titulo">🏆 Recorde</span>
          </div>

          <div class="estatistica">
            <span id="xp" class="numero">0</span>
            <span class="titulo">⭐ XP</span>
          </div>

          <div class="estatistica">
            <span id="brawlerCount" class="numero">0</span>
            <span class="titulo">👊 Brawlers</span>
          </div>

        </div>

      </div>

      <div class="card">

        <h2>👊 Meus Brawlers</h2>

        <div id="listaBrawlers" class="brawlers"></div>

      </div>

    </div>

  </div>

  <script>

    async function buscarPerfil() {

      const campo = document.getElementById("tag");
      const status = document.getElementById("status");
      const perfil = document.getElementById("perfil");

      let tag = campo.value.trim().toUpperCase();

      if (!tag) {
        status.textContent = "Digite sua tag primeiro!";
        status.className = "erro";
        return;
      }

      if (!tag.startsWith("#")) {
        tag = "#" + tag;
      }

      status.className = "";
      status.textContent = "🔄 Procurando seu perfil...";

      perfil.style.display = "none";

      try {

        /*
         * IMPORTANTE:
         * O endereço abaixo será o seu servidor.
         *
         * Depois vamos criar o servidor para conversar
         * com a API oficial do Brawl Stars.
         */

        const resposta = await fetch(
          "https://SEU-SERVIDOR-AQUI.com/player/" +
          encodeURIComponent(tag)
        );

        if (!resposta.ok) {
          throw new Error("Jogador não encontrado");
        }

        const jogador = await resposta.json();

        document.getElementById("nome").textContent =
          jogador.name || "Jogador";

        document.getElementById("tagJogador").textContent =
          jogador.tag || tag;

        document.getElementById("trofeus").textContent =
          jogador.trophies ?? 0;

        document.getElementById("recorde").textContent =
          jogador.highestTrophies ?? 0;

        document.getElementById("xp").textContent =
          jogador.expLevel ?? 0;

        const brawlers = jogador.brawlers || [];

        document.getElementById("brawlerCount").textContent =
          brawlers.length;

        const lista =
          document.getElementById("listaBrawlers");

        lista.innerHTML = "";

        brawlers.forEach(brawler => {

          const div = document.createElement("div");

          div.className = "brawler";

          div.innerHTML = `
            <strong>👊 ${escapeHTML(brawler.name)}</strong>
            🏆 ${brawler.trophies ?? 0} troféus<br>
            ⭐ Poder ${brawler.power ?? 0}<br>
            📈 Recorde ${brawler.highestTrophies ?? 0}
          `;

          lista.appendChild(div);

        });

        perfil.style.display = "block";

        status.textContent =
          "✅ Perfil carregado!";

      } catch (erro) {

        console.error(erro);

        status.textContent =
          "❌ Não consegui encontrar esse perfil.";

        status.className = "erro";

      }
    }


    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    document.getElementById("tag")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          buscarPerfil();
        }

      });

  </script>

</body>
</html>
