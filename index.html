<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tsuki RPG</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#080b12;
  color:#fff;
  overflow:hidden;
  touch-action:none
}

button{
  border:0;
  color:#fff;
  font-weight:bold;
  cursor:pointer
}

#game{
  width:100vw;
  height:100vh;
  background:
    radial-gradient(circle at 50% 20%,#405b72,#101722 70%);
  position:relative;
  overflow:hidden
}

/* MENU */

#menu{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.menuBox{
  width:min(480px,100%);
  padding:28px;
  text-align:center;
  border-radius:25px;
  background:#111c2aee;
  border:2px solid #ffffff18;
  box-shadow:0 20px 60px #0009
}

.logo{
  font-size:44px;
  font-weight:1000;
  color:#d9a441;
  text-shadow:0 4px #000;
  margin-bottom:8px
}

.subtitle{
  color:#aebdcc;
  margin-bottom:25px
}

.heroPreview{
  width:180px;
  height:230px;
  margin:auto;
  display:block;
  object-fit:contain
}

.btn{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:13px;
  background:#253c55;
  font-size:16px
}

.start{
  background:linear-gradient(#dcb653,#9c6b20);
  font-size:20px;
  box-shadow:0 4px #60420f
}

.btn:active{
  transform:translateY(2px)
}

/* HUD */

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:70px;
  background:#0a1019dd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  z-index:20;
  border-bottom:1px solid #ffffff18
}

.playerInfo{
  display:flex;
  align-items:center;
  gap:9px
}

.miniAvatar{
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:12px;
  background:#172638
}

.name{
  font-weight:900
}

.level{
  font-size:12px;
  color:#dcb653
}

.resources{
  text-align:right;
  font-size:13px;
  line-height:20px
}

.gold{
  color:#ffd45a
}

/* MAP */

#world{
  position:absolute;
  inset:70px 0 0;
  background:
    radial-gradient(circle at 30% 30%,#477f48,transparent 25%),
    radial-gradient(circle at 75% 60%,#355e3c,transparent 30%),
    linear-gradient(#263d2d,#17251d);
  overflow:hidden
}

.grass{
  position:absolute;
  inset:0;
  opacity:.35;
  background-image:
    radial-gradient(#89a85b 1px,transparent 1px);
  background-size:28px 28px
}

.road{
  position:absolute;
  width:140%;
  height:130px;
  left:-20%;
  top:48%;
  background:#8b7657;
  transform:rotate(-8deg);
  box-shadow:0 0 15px #0005
}

.road2{
  position:absolute;
  width:130%;
  height:100px;
  left:-10%;
  top:25%;
  background:#806c50;
  transform:rotate(12deg);
  opacity:.8
}

.tree{
  position:absolute;
  width:70px;
  height:95px;
  z-index:2
}

.tree:before{
  content:"";
  position:absolute;
  left:29px;
  bottom:0;
  width:16px;
  height:45px;
  background:#503823;
  border-radius:8px
}

.tree:after{
  content:"";
  position:absolute;
  left:5px;
  top:0;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#214f2b;
  box-shadow:
    25px -15px 0 #2e6938,
    35px 15px 0 #1b4726
}

/* PLAYER */

.character{
  position:absolute;
  width:82px;
  height:105px;
  object-fit:contain;
  z-index:10;
  transition:left .06s,top .06s
}

#player{
  left:48%;
  top:60%;
  transform:translate(-50%,-50%)
}

.enemy{
  z-index:8
}

/* NPC / CHEST */

.chest{
  position:absolute;
  width:50px;
  height:45px;
  background:#7a421c;
  border:4px solid #d89c40;
  border-radius:7px;
  z-index:4
}

.chest:after{
  content:"";
  position:absolute;
  width:8px;
  height:12px;
  background:#ffd45a;
  left:50%;
  top:15px;
  transform:translateX(-50%)
}

/* CONTROLS */

#controls{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none
}

.joystick{
  pointer-events:auto;
  position:absolute;
  left:18px;
  bottom:20px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#ffffff18;
  border:3px solid #ffffff38
}

.stick{
  position:absolute;
  left:50%;
  top:50%;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffffff9c;
  border:3px solid #fff;
  transform:translate(-50%,-50%)
}

.actions{
  pointer-events:auto;
  position:absolute;
  right:15px;
  bottom:18px;
  display:flex;
  gap:8px;
  align-items:end
}

.action{
  width:62px;
  height:62px;
  border-radius:50%;
  border:3px solid #ffffff55;
  font-size:11px
}

.attack{
  width:72px;
  height:72px;
  background:#b93737
}

.skill{
  background:#385da0
}

.heal{
  background:#27834a
}

/* STATUS */

.status{
  position:absolute;
  left:50%;
  top:82px;
  transform:translateX(-50%);
  background:#07101bdd;
  padding:8px 15px;
  border-radius:12px;
  z-index:25;
  font-size:13px;
  color:#e6c968;
  white-space:nowrap
}

.hpBox{
  position:absolute;
  left:50%;
  top:108px;
  transform:translateX(-50%);
  width:180px;
  height:9px;
  background:#281417;
  border-radius:10px;
  overflow:hidden;
  z-index:25
}

.hpBar{
  height:100%;
  width:100%;
  background:#42c95a
}

/* PANEL */

.panel{
  position:absolute;
  inset:0;
  background:#000a;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px
}

.panel.show{
  display:flex
}

.panelBox{
  width:min(430px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111c2a;
  border:2px solid #ffffff18;
  border-radius:22px;
  padding:18px
}

.panelBox h2{
  margin-bottom:12px;
  color:#e2c263
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#1b2b3e;
  border-radius:10px;
  margin:6px 0
}

.close{
  background:#673333
}

input{
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid #ffffff20;
  background:#07101b;
  color:white;
  margin:5px 0 10px
}

select{
  width:100%;
  padding:12px;
  background:#07101b;
  color:#fff;
  border-radius:9px;
  margin-bottom:10px
}

.notification{
  position:absolute;
  left:50%;
  bottom:145px;
  transform:translateX(-50%);
  background:#101b28ee;
  padding:11px 16px;
  border-radius:12px;
  z-index:80;
  opacity:0;
  transition:.2s
}

.notification.show{
  opacity:1
}

/* COMBAT */

.damage{
  position:absolute;
  color:#ffdc58;
  font-size:25px;
  font-weight:1000;
  z-index:50;
  animation:damage .5s forwards;
  pointer-events:none
}

@keyframes damage{
  from{
    transform:translateY(0) scale(.7);
    opacity:1
  }
  to{
    transform:translateY(-55px) scale(1.15);
    opacity:0
  }
}

.attackAnim{
  animation:attack .2s
}

@keyframes attack{
  50%{
    transform:translate(-50%,-50%) scale(1.25)
  }
}

.enemyHit{
  animation:enemyHit .18s
}

@keyframes enemyHit{
  50%{
    filter:brightness(2)
  }
}

.magic{
  position:absolute;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#8e62ff;
  box-shadow:0 0 25px #9b73ff;
  z-index:40;
  animation:magic .45s linear forwards
}

@keyframes magic{
  to{
    left:50%;
    top:50%;
    opacity:0
  }
}

@media(max-width:600px){

.logo{
  font-size:34px
}

.character{
  width:70px;
  height:90px
}

.joystick{
  width:95px;
  height:95px
}

}
</style>
</head>

<body>

<div id="game">

<!-- MENU -->

<div id="menu">

<div class="menuBox">

<div class="logo">TSUKI RPG</div>

<div class="subtitle">
A aventura começa agora.
</div>

<img id="heroPreview"
class="heroPreview">

<button class="btn start"
onclick="startGame()">
⚔️ COMEÇAR AVENTURA
</button>

<button class="btn"
onclick="openInventory()">
🎒 INVENTÁRIO
</button>

<button class="btn"
onclick="openDev()">
🛠️ DESENVOLVEDOR
</button>

</div>

</div>


<!-- HUD -->

<div id="hud" style="display:none">

<div class="playerInfo">

<img id="miniAvatar"
class="miniAvatar">

<div>
<div class="name" id="hudName">
Aventureiro
</div>

<div class="level">
Nível <span id="level">1</span>
</div>
</div>

</div>

<div class="resources">

<div>
❤️ <span id="hp">100</span>/100
</div>

<div class="gold">
💰 <span id="gold">100</span>
</div>

</div>

</div>


<!-- WORLD -->

<div id="world" style="display:none">

<div class="grass"></div>

<div class="road"></div>
<div class="road2"></div>

<div class="tree" style="left:5%;top:12%"></div>
<div class="tree" style="left:80%;top:15%"></div>
<div class="tree" style="left:15%;top:72%"></div>
<div class="tree" style="left:85%;top:70%"></div>

<div class="chest"
style="left:72%;top:43%"
onclick="openChest()">
</div>

<img id="player"
class="character">

<img id="enemy"
class="character enemy"
style="left:72%;top:50%;display:none">

</div>


<!-- STATUS -->

<div id="status"
class="status"
style="display:none">
Explore o mapa
</div>

<div id="enemyHpBox"
class="hpBox"
style="display:none">

<div id="enemyHpBar"
class="hpBar">
</div>

</div>


<!-- CONTROLS -->

<div id="controls"
style="display:none">

<div id="joystick"
class="joystick">

<div id="stick"
class="stick">
</div>

</div>

<div class="actions">

<button
class="action attack"
onclick="attack()">
⚔️<br>ATACAR
</button>

<button
class="action skill"
onclick="skill()">
✨<br>MAGIA
</button>

<button
class="action heal"
onclick="heal()">
💚<br>CURA
</button>

</div>

</div>


<!-- INVENTÁRIO -->

<div id="inventory"
class="panel">

<div class="panelBox">

<h2>🎒 Inventário</h2>

<div id="inventoryList">
</div>

<button
class="btn close"
onclick="closePanels()">
FECHAR
</button>

</div>

</div>


<!-- DEV -->

<div id="dev"
class="panel">

<div class="panelBox">

<h2>🛠️ MODO DESENVOLVEDOR</h2>

<p style="color:#9facba;font-size:13px">
Área para testar o jogo.
</p>

<label>💰 Moedas</label>

<input
id="devGold"
type="number"
value="100">

<button
class="btn"
onclick="giveGold()">
Adicionar moedas
</button>


<label>📈 Nível</label>

<input
id="devLevel"
type="number"
value="1">

<button
class="btn"
onclick="setLevel()">
Alterar nível
</button>


<label>❤️ Vida</label>

<button
class="btn"
onclick="fullHeal()">
Vida máxima
</button>


<label>⚔️ Arma</label>

<select id="devWeapon">

<option>Espada de Ferro</option>
<option>Machado do Guardião</option>
<option>Arco Lunar</option>
<option>Cajado Arcano</option>
<option>Lança Sombria</option>
<option>Espada Lendária</option>

</select>

<button
class="btn"
onclick="giveWeapon()">
Adicionar arma
</button>


<button
class="btn"
onclick="spawnEnemy()">
👾 Criar inimigo
</button>


<button
class="btn"
onclick="clearSave()">
🗑️ Resetar progresso
</button>


<button
class="btn close"
onclick="closePanels()">
FECHAR
</button>

</div>

</div>


<div id="notification"
class="notification">
</div>

</div>


<script>

/* =========================
   DADOS
========================= */

const weapons=[
{
name:"Espada de Ferro",
damage:20,
rarity:"Comum"
},
{
name:"Machado do Guardião",
damage:35,
rarity:"Raro"
},
{
name:"Arco Lunar",
damage:45,
rarity:"Épico"
},
{
name:"Cajado Arcano",
damage:55,
rarity:"Mítico"
},
{
name:"Lança Sombria",
damage:65,
rarity:"Lendário"
},
{
name:"Espada Lendária",
damage:90,
rarity:"Lendário"
}
];

let player={
name:"Aventureiro",
level:1,
xp:0,
gold:100,
hp:100,
maxHp:100,
weapon:weapons[0],
inventory:[weapons[0].name]
};

let enemy={
hp:100,
maxHp:100,
damage:10,
alive:false
};

let playing=false;

let px=48;
let py=60;

let enemyX=72;
let enemyY=50;

let moving=false;


/* =========================
   SVG DO PERSONAGEM
========================= */

function createCharacter(){

let svg=`

<svg
xmlns="http://www.w3.org/2000/svg"
width="300"
height="400">

<defs>

<linearGradient
id="armor"
x1="0"
y1="0"
x2="1"
y2="1">

<stop
stop-color="#4f83c2"/>

<stop
offset="1"
stop-color="#172b48"/>

</linearGradient>

</defs>

<ellipse
cx="150"
cy="375"
rx="90"
ry="18"
fill="#0005"/>

<!-- pernas -->

<path
d="M105 270 L105 360 L135 360 L145 275"
fill="#202b3b"/>

<path
d="M155 275 L165 360 L195 360 L190 270"
fill="#202b3b"/>

<!-- corpo -->

<path
d="M85 175 Q150 145 215 175
L205 285 Q150 310 95 285 Z"
fill="url(#armor)"
stroke="#111"
stroke-width="8"/>

<!-- capa -->

<path
d="M90 180 Q55 230 70 320
Q110 305 120 285
L110 180"
fill="#4b2028"/>

<!-- pescoço -->

<rect
x="132"
y="135"
width="36"
height="45"
rx="10"
fill="#d69c7b"/>

<!-- cabeça -->

<circle
cx="150"
cy="105"
r="65"
fill="#e2ad89"
stroke="#171717"
stroke-width="7"/>

<!-- cabelo -->

<path
d="M88 105
Q82 25 150 25
Q220 25 215 110
L190 70
L170 95
L145 62
L120 100
L100 75 Z"
fill="#20242b"/>

<!-- olhos -->

<circle
cx="125"
cy="112"
r="8"
fill="#17212c"/>

<circle
cx="175"
cy="112"
r="8"
fill="#17212c"/>

<!-- nariz -->

<path
d="M150 115 L142 137 L155 137"
fill="none"
stroke="#9d6d58"
stroke-width="5"/>

<!-- boca -->

<path
d="M130 150 Q150 162 170 150"
fill="none"
stroke="#713f3c"
stroke-width="5"/>

<!-- braço -->

<path
d="M95 190 Q50 220 65 270"
fill="none"
stroke="#355c87"
stroke-width="28"
stroke-linecap="round"/>

<!-- espada -->

<path
d="M70 270 L20 205"
stroke="#ddd"
stroke-width="13"/>

<path
d="M52 250 L75 230"
stroke="#9c6a2e"
stroke-width="12"/>

</svg>
`;

return "data:image/svg+xml;charset=UTF-8,"
+encodeURIComponent(svg);

}


/* =========================
   INÍCIO
========================= */

const characterArt=createCharacter();

document.getElementById(
"heroPreview"
).src=characterArt;

document.getElementById(
"miniAvatar"
).src=characterArt;

document.getElementById(
"player"
).src=characterArt;


/* =========================
   JOGO
========================= */

function startGame(){

playing=true;

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"hud"
).style.display="flex";

document.getElementById(
"world"
).style.display="block";

document.getElementById(
"controls"
).style.display="block";

document.getElementById(
"status"
).style.display="block";

updateHUD();

notify(
"⚔️ A aventura começou!"
);

}


/* =========================
   MOVIMENTO
========================= */

function move(dx,dy){

if(!playing)return;

let speed=.18;

px+=dx*speed;
py+=dy*speed;

px=Math.max(4,Math.min(92,px));
py=Math.max(8,Math.min(88,py));

updatePlayer();

checkEnemyDistance();

}


function updatePlayer(){

let p=
document.getElementById("player");

p.style.left=
px+"%";

p.style.top=
py+"%";

}


/* =========================
   INIMIGO
========================= */

function spawnEnemy(){

enemy.alive=true;

enemy.hp=100;

enemy.damage=10;

enemyX=72;

enemyY=50;

let el=
document.getElementById("enemy");

el.style.display="block";

el.src=createEnemy();

el.style.left=
enemyX+"%";

el.style.top=
enemyY+"%";

document.getElementById(
"enemyHpBox"
).style.display="block";

updateEnemy();

notify(
"👾 Um inimigo apareceu!"
);

}


function createEnemy(){

let svg=`

<svg
xmlns="http://www.w3.org/2000/svg"
width="300"
height="400">

<ellipse
cx="150"
cy="370"
rx="95"
ry="20"
fill="#0005"/>

<path
d="M75 180 Q150 140 225 180
L210 300 Q150 330 90 300Z"
fill="#7c3030"
stroke="#171717"
stroke-width="8"/>

<circle
cx="150"
cy="105"
r="65"
fill="#9c654e"
stroke="#151515"
stroke-width="8"/>

<path
d="M85 100 Q95 20 150 25
Q215 20 220 105
L185 70 L160 95
L130 65 L105 100Z"
fill="#111"/>

<circle
cx="125"
cy="115"
r="10"
fill="#ff4444"/>

<circle
cx="175"
cy="115"
r="10"
fill="#ff4444"/>

<path
d="M120 155 Q150 175 180 155"
fill="none"
stroke="#351616"
stroke-width="8"/>

</svg>
`;

return "data:image/svg+xml;charset=UTF-8,"
+encodeURIComponent(svg);

}


function updateEnemy(){

let el=
document.getElementById("enemy");

el.style.left=
enemyX+"%";

el.style.top=
enemyY+"%";

document.getElementById(
"enemyHpBar"
).style.width=
(enemy.hp/enemy.maxHp*100)+"%";

}


function checkEnemyDistance(){

if(!enemy.alive)return;

let dx=px-enemyX;
let dy=py-enemyY;

let distance=
Math.hypot(dx,dy);

if(distance<28){

document.getElementById(
"status"
).textContent=
"👾 Inimigo perto!";

}else{

document.getElementById(
"status"
).textContent=
"Explore o mapa";

}

}


/* =========================
   IA INIMIGO
========================= */

setInterval(()=>{

if(!playing||!enemy.alive)return;

let dx=px-enemyX;
let dy=py-enemyY;

let distance=
Math.hypot(dx,dy);

if(distance>14){

enemyX+=(dx/distance)*.08;
enemyY+=(dy/distance)*.08;

updateEnemy();

}else{

enemyAttack();

}

},60);


let lastEnemyAttack=0;

function enemyAttack(){

let now=Date.now();

if(now-lastEnemyAttack<900)return;

lastEnemyAttack=now;

player.hp-=enemy.damage;

if(player.hp<0)
player.hp=0;

updateHUD();

showDamage(
px,
py,
"-"+enemy.damage
);

if(player.hp<=0){

notify(
"💀 Você foi derrotado!"
);

player.hp=player.maxHp;

px=48;
py=60;

updatePlayer();

}

}


/* =========================
   ATAQUE
========================= */

function attack(){

if(!playing){

return;

}

if(!enemy.alive){

notify(
"Não há inimigo aqui."
);

return;

}

let dx=px-enemyX;

let dy=py-enemyY;

let distance=
Math.hypot(dx,dy);

if(distance>16){

notify(
"⚔️ Chegue mais perto!"
);

return;

}

let playerEl=
document.getElementById(
"player"
);

playerEl.classList.add(
"attackAnim"
);

setTimeout(()=>{
playerEl.classList.remove(
"attackAnim"
);
},200);

let damage=
player.weapon.damage;

enemy.hp-=damage;

showDamage(
enemyX,
enemyY,
"-"+damage
);

let enemyEl=
document.getElementById(
"enemy"
);

enemyEl.classList.add(
"enemyHit"
);

setTimeout(()=>{
enemyEl.classList.remove(
"enemyHit"
);
},200);

updateEnemy();

if(enemy.hp<=0){

defeatEnemy();

}

}


/* =========================
   MAGIA
========================= */

function skill(){

if(!playing)return;

if(!enemy.alive){

notify(
"✨ Nenhum inimigo."
);

return;

}

let magic=
document.createElement("div");

/* =========================
   CURA
========================= */

function heal(){

if(!playing)return;

if(player.hp>=player.maxHp){

notify(
"❤️ Sua vida já está cheia."
);

return;

}

player.hp+=30;

if(player.hp>player.maxHp)
player.hp=player.maxHp;

updateHUD();

notify(
"💚 Você recuperou vida!"
);

}


/* =========================
   INIMIGO DERROTADO
========================= */

function defeatEnemy(){

enemy.alive=false;

enemy.hp=0;

document.getElementById(
"enemy"
).style.display="none";

document.getElementById(
"enemyHpBox"
).style.display="none";

player.xp+=50;

player.gold+=25;

checkLevel();

updateHUD();

notify(
"🏆 Inimigo derrotado! +50 XP +25 💰"
);

}


/* =========================
   XP
========================= */

function checkLevel(){

let needed=
player.level*100;

if(player.xp>=needed){

player.xp-=needed;

player.level++;

player.maxHp+=20;

player.hp=
player.maxHp;

notify(
"🎉 VOCÊ SUBIU PARA O NÍVEL "
+player.level+"!"
);

}

}


/* =========================
   BAÚ
========================= */

function openChest(){

let weapon=
weapons[
Math.floor(
Math.random()*weapons.length
)
];

if(!player.inventory.includes(
weapon.name
)){

player.inventory.push(
weapon.name
);

player.weapon=weapon;

notify(
"🎁 Você encontrou: "
+weapon.name
);

}else{

player.gold+=50;

notify(
"💰 O baú tinha 50 moedas!"
);

}

updateHUD();

}


/* =========================
   INVENTÁRIO
========================= */

function openInventory(){

let html="";

player.inventory.forEach(name=>{

let weapon=
weapons.find(
w=>w.name===name
);

html+=`

<div class="item">

<div>
<b>${weapon.name}</b>
<br>
<small>
⚔️ ${weapon.damage}
• ${weapon.rarity}
</small>
</div>

<button
class="smallBtn"
style="width:100px;margin:0"
onclick="equip('${weapon.name}')">
EQUIPAR
</button>

</div>

`;

});

document.getElementById(
"inventoryList"
).innerHTML=
html;

document.getElementById(
"inventory"
).classList.add("show");

}
